version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(pip)"

  - package-ecosystem: "docker"
    directories:
      - "/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker-compose"
    directories:
      - "/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker-compose)"

  - package-ecosystem: "github-actions"
    directories:
      - "/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
