version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(pip)"
    groups:
      pip-routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker-compose"
    directories:
      - "/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker-compose)"
    groups:
      docker-compose-routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directories:
      - "/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions-routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
