
name: Deploy Authelia
on:
  workflow_dispatch:
    inputs:
      host_machine:
        required: false
        type: string
        default: 'rpi4-server'
      domain:
        required: false
        type: string
        default: 'auth.14monarch.james-fagg.uk'
  workflow_call:
    inputs:
      host_machine:
        required: false
        type: string
        default: 'rpi4-server'
      domain:
        required: false
        type: string
        default: 'auth.14monarch.james-fagg.uk'
  push:
    branches:
      - main
      - '**'
    paths:
      - '.github/workflows/authelia-deploy.yml'
      - 'authelia/**'
env:
  host_machine: ${{ inputs.host_machine || 'rpi4-server' }}
  domain: ${{ inputs.domain || 'auth.14monarch.james-fagg.uk' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-deployments
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set node config
        id: node_config
        run: |
          if [ "${{ env.host_machine }}" = "rpi4-server" ]; then
            echo "ssh_host=${{ vars.RPI4_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.RPI4_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_RPI4 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          elif [ "${{ env.host_machine }}" = "e7270-server" ]; then
            echo "ssh_host=${{ vars.E7270_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.E7270_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_E7270 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          fi

      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 192.168.2.2/30
          DNS = ${{ vars.Keepalived_IP }}
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, ${{ vars.IP_LJFCLOUD_ARM }}/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5: bringing up WireGuard..."
            if sudo wg-quick up ./wg0.conf; then
              echo "WireGuard up successfully"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "WireGuard failed after 5 attempts"
              exit 1
            fi
            echo "Failed, waiting 10s before retry..."
            sudo ip link delete dev wg0 2>/dev/null || true
            sleep 10
          done
          sudo wg show

      # wg-quick's DNS= pushes the runner's resolver to the internal
      # Keepalived IP, which can't (reliably) resolve public names. The
      # steps below pull authelia/authelia:latest from Docker Hub to hash
      # secrets locally, so restore public DNS while keeping the tunnel up
      # for the internal (by-IP) traffic.
      - name: Override system DNS resolver
        run: |
          sudo rm /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf

      - name: Ensure authelia config dir is writable
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          script: |
            sudo mkdir -p /opt/stacks/authelia/config
            sudo chown -R ${{ steps.node_config.outputs.ssh_user }}:${{ steps.node_config.outputs.ssh_user }} /opt/stacks/authelia/config

      - name: Look up host user id/group id
        id: user_ids
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          capture_stdout: true
          script: |
            echo "PUID_PGID=$(id -u):$(id -g)"

      - name: Parse host user id/group id
        id: host_ids
        run: |
          LINE=$(echo "${{ steps.user_ids.outputs.stdout }}" | grep '^PUID_PGID=')
          echo "puid=$(echo "$LINE" | cut -d= -f2 | cut -d: -f1)" >> $GITHUB_OUTPUT
          echo "pgid=$(echo "$LINE" | cut -d= -f2 | cut -d: -f2)" >> $GITHUB_OUTPUT

      - name: Hash Portainer OIDC client secret
        id: hash_oidc_secret
        env:
          PORTAINER_OIDC_CLIENT_SECRET: ${{ secrets.PORTAINER_OIDC_CLIENT_SECRET }}
        run: |
          HASH=$(docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --password "$PORTAINER_OIDC_CLIENT_SECRET" | sed -n 's/^Digest: //p')
          if [ -z "$HASH" ]; then
            echo "::error::Failed to generate Portainer OIDC client secret hash"
            exit 1
          fi
          echo "::add-mask::$HASH"
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Render configuration.yml
        env:
          AUTHELIA_SESSION_SECRET: ${{ secrets.AUTHELIA_SESSION_SECRET }}
          AUTHELIA_STORAGE_ENCRYPTION_KEY: ${{ secrets.AUTHELIA_STORAGE_ENCRYPTION_KEY }}
          AUTHELIA_JWT_SECRET: ${{ secrets.AUTHELIA_JWT_SECRET }}
          gmail_address: ${{ vars.GMAIL_ADDRESS }}
          gmail_app_password: ${{ secrets.AUTHELIA_GMAIL_APP_PASSWORD }}
          AUTHELIA_SMTP_SENDER: ${{ vars.HOMELAB_EMAIL }}
          AUTHELIA_OIDC_HMAC_SECRET: ${{ secrets.AUTHELIA_OIDC_HMAC_SECRET }}
          AUTHELIA_OIDC_ISSUER_PRIVATE_KEY: ${{ secrets.AUTHELIA_OIDC_ISSUER_PRIVATE_KEY }}
          AUTHELIA_OIDC_PORTAINER_CLIENT_SECRET_HASH: ${{ steps.hash_oidc_secret.outputs.hash }}
        run: |
          envsubst < authelia/config/configuration.yml.template > authelia/config/configuration.yml

      - name: Hash admin password for Authelia
        id: hash_password
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          HASH=$(docker run --rm authelia/authelia:latest authelia crypto hash generate argon2 --password "$APP_PASSWORD" | sed -n 's/^Digest: //p')
          if [ -z "$HASH" ]; then
            echo "::error::Failed to generate Authelia password hash"
            exit 1
          fi
          echo "::add-mask::$HASH"
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Render users_database.yml
        env:
          AUTHELIA_ADMIN_USERNAME: ${{ vars.APP_USER }}
          AUTHELIA_ADMIN_EMAIL: ${{ vars.HOMELAB_EMAIL }}
          AUTHELIA_ADMIN_PASSWORD_HASH: ${{ steps.hash_password.outputs.hash }}
        run: |
          export AUTHELIA_ADMIN_USERNAME="$(echo "$AUTHELIA_ADMIN_USERNAME" | tr '[:upper:]' '[:lower:]')"
          envsubst < authelia/config/users_database.yml.template > authelia/config/users_database.yml

      - name: Copy rendered config to host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          source: "authelia/config/configuration.yml,authelia/config/users_database.yml"
          target: "/opt/stacks/authelia/config/"
          strip_components: 2
          overwrite: true

      - name: Authenticate to Portainer
        id: auth
        run: |
          RESPONSE=$(curl -X POST "http://${{ vars.RPI4_IP }}:83/api/auth" \
            -H "Content-Type: application/json" \
            -d '{
                 "Username":"${{ vars.APP_USER }}",
                 "Password":"${{ secrets.APP_PASSWORD }}"
                 }')
          TOKEN=$(echo "$RESPONSE" | jq -r '.jwt')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Get Portainer EndpointId
        id: endpoint
        run: |
          echo "Looking for endpoint with name: $host_machine"
          RESPONSE=$(curl -s -X GET "http://${{ vars.RPI4_IP }}:83/api/endpoints" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          ENDPOINT_ID=$(echo "$RESPONSE" | jq -r --arg host_machine "$host_machine" '.[] | select(.Name==$host_machine) | .Id')
          echo "endpoint_id=$ENDPOINT_ID" >> $GITHUB_OUTPUT

      - name: Get Stack ID (if exists)
        id: get_stack_id
        run: |
          STACKS=$(curl --fail -s -X GET "http://${{ vars.RPI4_IP }}:83/api/stacks" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" || echo "[]")

          STACK_ID=$(echo "$STACKS" | jq -r \
            --arg name "authelia" \
            --argjson endpoint_id "${{ steps.endpoint.outputs.endpoint_id }}" \
            '.[] | select(.Name==$name and .EndpointId==$endpoint_id) | .Id')

          if [ -z "$STACK_ID" ] || [ "$STACK_ID" = "null" ]; then
            echo "Stack not found for this endpoint."
            echo "stack_id=0" >> $GITHUB_OUTPUT
          else
            echo "Stack found with ID: $STACK_ID"
            echo "stack_id=$STACK_ID" >> $GITHUB_OUTPUT
          fi

      - name: Get stack webhook token
        if: ${{ steps.get_stack_id.outputs.stack_id != '0' }}
        id: get_webhook
        run: |
          WEBHOOK_TOKEN=$(curl -s \
            --max-time 10 \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            "http://${{ vars.RPI4_IP }}:83/api/stacks/${{ steps.get_stack_id.outputs.stack_id }}?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
            | jq -r '.AutoUpdate.Webhook')

          echo "Webhook token: $WEBHOOK_TOKEN"
          echo "webhook_token=$WEBHOOK_TOKEN" >> $GITHUB_OUTPUT

      - name: Generate UUID
        if: ${{ steps.get_stack_id.outputs.stack_id == '0' }}
        id: uuid
        run: |
          echo "uuid=$(uuidgen)" >> $GITHUB_OUTPUT

      - name: Create Stack from GitHub
        if: ${{ steps.get_stack_id.outputs.stack_id == '0' }}
        run: |
          echo "Creating stack from GitHub..."
          RESPONSE=$(curl -v -s -S -X POST "http://${{ vars.RPI4_IP }}:83/api/stacks/create/standalone/repository?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
          -H "Content-Type: application/json" \
          -d '{
               "Name": "authelia",
               "RepositoryURL": "https://github.com/liamj-f/homelab-setup",
               "RepositoryReferenceName": "${{ github.ref }}",
               "ComposeFile": "authelia/authelia-compose.yml",
               "RepositoryAuthentication": false,
               "AutoUpdate": {
                              "forcePullImage": true,
                              "forceUpdate": true,
                              "Webhook": "${{ steps.uuid.outputs.uuid }}"
                             },
               "Env": [
                      {"name":"PUID", "value":"${{ steps.host_ids.outputs.puid }}"},
                      {"name":"PGID", "value":"${{ steps.host_ids.outputs.pgid }}"}
                      ],
               "Prune": true,
               "StackFileVersion": "3"
              }'
                    )

            echo "API Response: $RESPONSE"
            echo "stack_response=$RESPONSE" >> $GITHUB_OUTPUT

      - name: Update Stack Environment Variables
        if: ${{ steps.get_stack_id.outputs.stack_id != '0' }}
        run: |
            RESPONSE=$(curl -s -i -v --max-time 300 -X PUT "http://${{ vars.RPI4_IP }}:83/api/stacks/${{ steps.get_stack_id.outputs.stack_id }}/git/redeploy?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "AutoUpdate": {
                          "forcePullImage": true,
                          "forceUpdate": true,
                          "Webhook": "${{ steps.get_webhook.outputs.webhook_token }}"
                          },
                  "PullImage": true,
                  "RepositoryReferenceName": "${{ github.ref }}",
                  "repositoryAuthentication": false,
                  "Env": [
                         {"name":"PUID", "value":"${{ steps.host_ids.outputs.puid }}"},
                         {"name":"PGID", "value":"${{ steps.host_ids.outputs.pgid }}"}
                         ],
                  "Prune": false
                }'  )

              echo "API Response: $RESPONSE"

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show

  proxy_setup_onprem:
    uses: ./.github/workflows/proxy_config_onprem.yml
    secrets: inherit
    with:
      domain: ${{ inputs.domain || 'auth.14monarch.james-fagg.uk' }}
      app_host_machine: ${{ inputs.host_machine || 'rpi4-server' }}
      forward_port: 91
      # NPM inserts "Advanced" config at server scope, not inside location /,
      # so a bare header line is silently discarded - full replacement
      # location block instead. Hardcoded https, not $scheme: on this on-prem
      # hop NPM sees genuinely plain HTTP even though the domain is
      # HTTPS-only end-to-end from every real client's perspective - $scheme
      # here would report "http" and Authelia rejects any non-https value.
      advanced_config: |
        location / {
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $http_connection;
          proxy_http_version 1.1;
          proxy_pass_request_headers on;
          include conf.d/include/proxy.conf;
        }
  proxy_setup_oci:
    uses: ./.github/workflows/proxy_config_oci.yml
    secrets: inherit
    with:
      domain: ${{ inputs.domain || 'auth.14monarch.james-fagg.uk' }}
      host_machine: ${{ inputs.host_machine || 'rpi4-server' }}
      # NPM inserts "Advanced" config at server scope, not inside location /,
      # so a bare header line is silently discarded - full replacement
      # location block instead.
      # Hardcoded https, not $scheme: this domain is HTTPS-only end-to-end
      # from every real client's perspective, but traffic arriving via the
      # OCI tunnel is genuinely plain HTTP on this specific hop into on-prem
      # NPM (TLS was already terminated at the OCI edge) - $scheme here would
      # report "http" and Authelia rejects any non-https value.
      advanced_config: |
        location / {
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $http_connection;
          proxy_http_version 1.1;
          proxy_pass_request_headers on;
          # conf.d/include/proxy.conf already ends with its own proxy_pass -
          # do not add another one here, nginx rejects duplicate proxy_pass
          # directives in the same location block.
          include conf.d/include/proxy.conf;
        }

  f2b:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      actions: write
      contents: read
    concurrency:
      group: homelab-deployments
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set node config
        id: node_config
        run: |
          if [ "${{ env.host_machine }}" = "rpi4-server" ]; then
            echo "ssh_host=${{ vars.RPI4_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.RPI4_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_RPI4 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          elif [ "${{ env.host_machine }}" = "e7270-server" ]; then
            echo "ssh_host=${{ vars.E7270_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.E7270_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_E7270 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          fi
      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 192.168.2.2/30
          DNS = ${{ vars.Keepalived_IP }}
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, ${{ vars.IP_LJFCLOUD_ARM }}/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5: bringing up WireGuard..."
            if sudo wg-quick up ./wg0.conf; then
              echo "WireGuard up successfully"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "WireGuard failed after 5 attempts"
              exit 1
            fi
            echo "Failed, waiting 10s before retry..."
            sudo ip link delete dev wg0 2>/dev/null || true
            sleep 10
          done
          sudo wg show

      - name: Check fail2ban container exists
        id: check_f2b
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          capture_stdout: true
          script: |
            if docker inspect fail2ban >/dev/null 2>&1; then
              echo "F2B_EXISTS=true"
            else
              echo "F2B_EXISTS=false"
            fi

      # First-run bootstrap: if this host has never had the fail2ban stack
      # deployed, the steps below (copying filter/jail, `docker exec fail2ban
      # ...`) would fail against a container that doesn't exist yet. Trigger
      # fail2ban-redeploy.yml and wait for it before continuing.
      - name: Trigger fail2ban-redeploy if missing
        if: ${{ !contains(steps.check_f2b.outputs.stdout, 'F2B_EXISTS=true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "fail2ban container not found on ${{ env.host_machine }} - triggering fail2ban-redeploy.yml"
          gh workflow run fail2ban-redeploy.yml --ref ${{ github.ref_name }}
          sleep 10
          RUN_ID=$(gh run list --workflow=fail2ban-redeploy.yml --branch ${{ github.ref_name }} --limit 1 --json databaseId -q '.[0].databaseId')
          echo "Waiting for fail2ban-redeploy run $RUN_ID to complete..."
          gh run watch "$RUN_ID" --exit-status

      - name: make log directory
        uses: appleboy/ssh-action@v1.2.5
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            script: |
              sudo mkdir -p /opt/f2b-logs/authelia
              sudo touch /opt/f2b-logs/authelia/authelia.log
              sudo chmod 666 /opt/f2b-logs/authelia/authelia.log

      - name: Ensure fail2ban config dirs are writable
        uses: appleboy/ssh-action@v1.2.5
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            script: |
              sudo mkdir -p /opt/stacks/fail2ban/data/filter.d /opt/stacks/fail2ban/data/jail.d
              sudo chown -R ${{ steps.node_config.outputs.ssh_user }}:${{ steps.node_config.outputs.ssh_user }} /opt/stacks/fail2ban/data/filter.d /opt/stacks/fail2ban/data/jail.d

      - name: Copy f2b filter to host
        uses: appleboy/scp-action@v1.0.0
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            source: "authelia/filter.d/authelia.local"
            target: "/opt/stacks/fail2ban/data/filter.d/"
            strip_components: 2

      - name: Copy f2b jail to host
        uses: appleboy/scp-action@v1.0.0
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            source: "authelia/jail.d/authelia.local"
            target: "/opt/stacks/fail2ban/data/jail.d/"
            strip_components: 2

      - name: Reload f2b
        uses: appleboy/ssh-action@v1.2.5
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            script:
              docker exec fail2ban fail2ban-client reload

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show
