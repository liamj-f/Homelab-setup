
name: Deploy Code-Server
on:
  workflow_dispatch:
    inputs:
      host_machine:
        required: false
        type: string
        default: 'rpi4-server'
      domain:
        required: false
        type: string
        default: 'code.14monarch.james-fagg.uk'
      stack_name:
        required: false
        type: string
        default: 'code-server'
  workflow_call:
    inputs:
      host_machine:
        required: false
        type: string
        default: 'rpi4-server'
      domain:
        required: false
        type: string
        default: 'code.14monarch.james-fagg.uk'
      stack_name:
        required: false
        type: string
        default: 'code-server'
  push:
    branches:
      - main
      - '**'
    paths:
      - '.github/workflows/code-server-deploy.yml'
      - 'code-server/**'
env:
  host_machine: ${{ inputs.host_machine || 'rpi4-server' }}
  domain: ${{ inputs.domain || 'code.14monarch.james-fagg.uk' }}
  stack_name: ${{ inputs.stack_name || 'code-server' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-deployments
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set node config
        id: node_config
        run: |
          if [ "${{ env.host_machine }}" = "rpi4-server" ]; then
            echo "ssh_host=${{ vars.RPI4_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.RPI4_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_RPI4 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          elif [ "${{ env.host_machine }}" = "e7270-server" ]; then
            echo "ssh_host=${{ vars.E7270_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.E7270_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_E7270 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          fi

      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 192.168.2.2/30
          DNS = ${{ vars.Keepalived_IP }}
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, ${{ vars.IP_LJFCLOUD_ARM }}/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5: bringing up WireGuard..."
            if sudo wg-quick up ./wg0.conf; then
              echo "WireGuard up successfully"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "WireGuard failed after 5 attempts"
              exit 1
            fi
            echo "Failed, waiting 10s before retry..."
            sudo ip link delete dev wg0 2>/dev/null || true
            sleep 10
          done
          sudo wg show

      - name: Override system DNS resolver
        run: |
          sudo rm /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf

      - name: Ensure ${{ env.stack_name }} config dir is writable
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          script: |
            sudo mkdir -p /opt/stacks/${{ env.stack_name }}/config /opt/stacks/${{ env.stack_name }}/custom-cont-init.d
            sudo chown -R ${{ steps.node_config.outputs.ssh_user }}:${{ steps.node_config.outputs.ssh_user }} /opt/stacks/${{ env.stack_name }}/

      - name: Render config.yml
        run: |
          envsubst < ${{ env.stack_name }}/config.yml.template > ${{ env.stack_name }}/config.yml

      - name: Copy rendered config to host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          source: "${{ env.stack_name }}/config.yml"
          target: "/opt/stacks/${{ env.stack_name }}/config/"
          strip_components: 2
          overwrite: true

      - name: Copy custom-cont-init.d scripts to host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          source: "${{ env.stack_name }}/custom-cont-init.d"
          target: "/opt/stacks/${{ env.stack_name }}/"
          strip_components: 1
          overwrite: true

      - name: Set permissions on custom-cont-init.d scripts
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          script: |
            chmod -R +x /opt/stacks/${{ env.stack_name }}/custom-cont-init.d/

      - name: Authenticate to Portainer
        id: auth
        run: |
          RESPONSE=$(curl -X POST "http://${{ vars.RPI4_IP }}:83/api/auth" \
            -H "Content-Type: application/json" \
            -d '{
                 "Username":"${{ vars.APP_USER }}",
                 "Password":"${{ secrets.APP_PASSWORD }}"
                 }')
          TOKEN=$(echo "$RESPONSE" | jq -r '.jwt')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Get Portainer EndpointId
        id: endpoint
        run: |
          echo "Looking for endpoint with name: $host_machine"
          RESPONSE=$(curl -s -X GET "http://${{ vars.RPI4_IP }}:83/api/endpoints" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          ENDPOINT_ID=$(echo "$RESPONSE" | jq -r --arg host_machine "$host_machine" '.[] | select(.Name==$host_machine) | .Id')
          echo "endpoint_id=$ENDPOINT_ID" >> $GITHUB_OUTPUT

      - name: Get Stack ID (if exists)
        id: get_stack_id
        run: |
          STACKS=$(curl --fail -s -X GET "http://${{ vars.RPI4_IP }}:83/api/stacks" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" || echo "[]")

          STACK_ID=$(echo "$STACKS" | jq -r \
            --arg name "${{ env.stack_name }}" \
            --argjson endpoint_id "${{ steps.endpoint.outputs.endpoint_id }}" \
            '.[] | select(.Name==$name and .EndpointId==$endpoint_id) | .Id')

          if [ -z "$STACK_ID" ] || [ "$STACK_ID" = "null" ]; then
            echo "Stack not found for this endpoint."
            echo "stack_id=0" >> $GITHUB_OUTPUT
          else
            echo "Stack found with ID: $STACK_ID"
            echo "stack_id=$STACK_ID" >> $GITHUB_OUTPUT
          fi

      - name: Get stack webhook token
        if: ${{ steps.get_stack_id.outputs.stack_id != '0' }}
        id: get_webhook
        run: |
          WEBHOOK_TOKEN=$(curl -s \
            --max-time 10 \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            "http://${{ vars.RPI4_IP }}:83/api/stacks/${{ steps.get_stack_id.outputs.stack_id }}?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
            | jq -r '.AutoUpdate.Webhook')

          echo "Webhook token: $WEBHOOK_TOKEN"
          echo "webhook_token=$WEBHOOK_TOKEN" >> $GITHUB_OUTPUT

      - name: Generate UUID
        if: ${{ steps.get_stack_id.outputs.stack_id == '0' }}
        id: uuid
        run: |
          echo "uuid=$(uuidgen)" >> $GITHUB_OUTPUT

      - name: Create Stack from GitHub
        if: ${{ steps.get_stack_id.outputs.stack_id == '0' }}
        run: |
          echo "Creating stack from GitHub..."
          RESPONSE=$(curl -v -s -S -X POST "http://${{ vars.RPI4_IP }}:83/api/stacks/create/standalone/repository?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
          -H "Content-Type: application/json" \
          -d '{
               "Name": "${{ env.stack_name }}",
               "RepositoryURL": "https://github.com/liamj-f/homelab-setup",
               "RepositoryReferenceName": "${{ github.ref }}",
               "ComposeFile": "${{ env.stack_name }}/${{ env.stack_name }}-compose.yml",
               "RepositoryAuthentication": false,
               "AutoUpdate": {
                              "forcePullImage": true,
                              "forceUpdate": true,
                              "Webhook": "${{ steps.uuid.outputs.uuid }}"
                             },
               "Env": [
                      ],
               "Prune": true,
               "StackFileVersion": "3"
              }'
                    )

            echo "API Response: $RESPONSE"
            echo "stack_response=$RESPONSE" >> $GITHUB_OUTPUT

      - name: Update Stack Environment Variables
        if: ${{ steps.get_stack_id.outputs.stack_id != '0' }}
        run: |
            RESPONSE=$(curl -s -i -v --max-time 300 -X PUT "http://${{ vars.RPI4_IP }}:83/api/stacks/${{ steps.get_stack_id.outputs.stack_id }}/git/redeploy?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "AutoUpdate": {
                          "forcePullImage": true,
                          "forceUpdate": true,
                          "Webhook": "${{ steps.get_webhook.outputs.webhook_token }}"
                          },
                  "PullImage": true,
                  "RepositoryReferenceName": "${{ github.ref }}",
                  "repositoryAuthentication": false,
                  "Env": [
                         ],
                  "Prune": false
                }'  )

              echo "API Response: $RESPONSE"

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show

  proxy_setup_onprem:
    uses: ./.github/workflows/proxy_config_onprem.yml
    secrets: inherit
    with:
      domain: ${{ inputs.domain || 'code.14monarch.james-fagg.uk' }}
      app_host_machine: ${{ inputs.host_machine || 'rpi4-server' }}
      forward_port: 99
      # Unlike auth.14monarch.james-fagg.uk (which must bypass Authelia to
      # avoid gating its own login page), code-server is a normal protected
      # service - protect_with_authelia wires in the auth_request/authz
      # block automatically. Do NOT set advanced_config here as well:
      # supplying it disables that auto-generated block entirely.
      protect_with_authelia: true

  proxy_setup_oci:
    uses: ./.github/workflows/proxy_config_oci.yml
    secrets: inherit
    with:
      domain: ${{ inputs.domain || 'code.14monarch.james-fagg.uk' }}
      host_machine: ${{ inputs.host_machine || 'rpi4-server' }}
      # See proxy_setup_onprem above.
      protect_with_authelia: true

  f2b:
    needs: deploy
    uses: ./.github/workflows/fail2ban-jail-deploy.yml
    secrets: inherit
    with:
      host_machine: ${{ inputs.host_machine || 'rpi4-server' }}
      stack_name: ${{ inputs.stack_name || 'code-server' }}
