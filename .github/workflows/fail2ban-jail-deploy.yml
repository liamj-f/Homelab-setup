name: Deploy Fail2Ban Jail Config

# Shared by every *-deploy.yml pipeline's f2b leg. Copies that service's
# filter.d/<stack_name>.local and jail.d/<stack_name>.local onto the
# fail2ban host and reloads fail2ban, bootstrapping the fail2ban stack
# itself first (via fail2ban-redeploy.yml) if it isn't deployed yet on
# this host.
on:
  workflow_call:
    inputs:
      host_machine:
        description: 'Host machine the fail2ban stack runs on (rpi4-server or e7270-server)'
        required: true
        type: string
      stack_name:
        description: 'Service directory name - also the filter.d/<stack_name>.local and jail.d/<stack_name>.local file names'
        required: true
        type: string
      log_filename:
        description: 'Log file fail2ban should watch under /opt/f2b-logs/<stack_name>/. Defaults to <stack_name>.log'
        required: false
        type: string
        default: ''

jobs:
  f2b:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    concurrency:
      group: homelab-deployments
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Resolve log filename
        id: log
        run: |
          echo "filename=${{ inputs.log_filename || format('{0}.log', inputs.stack_name) }}" >> $GITHUB_OUTPUT

      - name: Set node config
        id: node_config
        run: |
          if [ "${{ inputs.host_machine }}" = "rpi4-server" ]; then
            echo "ssh_host=${{ vars.RPI4_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.RPI4_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_RPI4 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.host_machine }}" = "e7270-server" ]; then
            echo "ssh_host=${{ vars.E7270_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.E7270_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_E7270 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          fi

      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 192.168.2.2/30
          DNS = ${{ vars.Keepalived_IP }}
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, ${{ vars.IP_LJFCLOUD_ARM }}/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5: bringing up WireGuard..."
            if sudo wg-quick up ./wg0.conf; then
              echo "WireGuard up successfully"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "WireGuard failed after 5 attempts"
              exit 1
            fi
            echo "Failed, waiting 10s before retry..."
            sudo ip link delete dev wg0 2>/dev/null || true
            sleep 10
          done
          sudo wg show

      - name: Check fail2ban container exists
        id: check_f2b
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          capture_stdout: true
          script: |
            if docker inspect fail2ban >/dev/null 2>&1; then
              echo "F2B_EXISTS=true"
            else
              echo "F2B_EXISTS=false"
            fi

      # First-run bootstrap: if this host has never had the fail2ban stack
      # deployed, the steps below (copying filter/jail, `docker exec fail2ban
      # ...`) would fail against a container that doesn't exist yet. Trigger
      # fail2ban-redeploy.yml and wait for it before continuing.
      - name: Trigger fail2ban-redeploy if missing
        if: ${{ !contains(steps.check_f2b.outputs.stdout, 'F2B_EXISTS=true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "fail2ban container not found on ${{ inputs.host_machine }} - triggering fail2ban-redeploy.yml"
          gh workflow run fail2ban-redeploy.yml --ref ${{ github.ref_name }}
          sleep 10
          RUN_ID=$(gh run list --workflow=fail2ban-redeploy.yml --branch ${{ github.ref_name }} --limit 1 --json databaseId -q '.[0].databaseId')
          echo "Waiting for fail2ban-redeploy run $RUN_ID to complete..."
          gh run watch "$RUN_ID" --exit-status

      - name: make log directory
        uses: appleboy/ssh-action@v1.2.5
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            script: |
              sudo mkdir -p /opt/f2b-logs/${{ inputs.stack_name }}
              sudo touch /opt/f2b-logs/${{ inputs.stack_name }}/${{ steps.log.outputs.filename }}
              sudo chmod 666 /opt/f2b-logs/${{ inputs.stack_name }}/${{ steps.log.outputs.filename }}

      - name: Ensure fail2ban config dirs are writable
        uses: appleboy/ssh-action@v1.2.5
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            script: |
              sudo mkdir -p /opt/stacks/fail2ban/data/filter.d /opt/stacks/fail2ban/data/jail.d
              sudo chown -R ${{ steps.node_config.outputs.ssh_user }}:${{ steps.node_config.outputs.ssh_user }} /opt/stacks/fail2ban/data/filter.d /opt/stacks/fail2ban/data/jail.d

      - name: Copy f2b filter to host
        uses: appleboy/scp-action@v1.0.0
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            source: "${{ inputs.stack_name }}/filter.d/${{ inputs.stack_name }}.local"
            target: "/opt/stacks/fail2ban/data/filter.d/"
            strip_components: 2

      - name: Copy f2b jail to host
        uses: appleboy/scp-action@v1.0.0
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            source: "${{ inputs.stack_name }}/jail.d/${{ inputs.stack_name }}.local"
            target: "/opt/stacks/fail2ban/data/jail.d/"
            strip_components: 2

      - name: Reload f2b
        uses: appleboy/ssh-action@v1.2.5
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            script:
              docker exec fail2ban fail2ban-client reload

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show
