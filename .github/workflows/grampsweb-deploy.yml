name: Redeploy GrampsWeb via Portainer GitOps
#ToDo:
# create the mount points and automount
# then rescan files if the database isn't intact.

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - 'grampsweb/**'
      - '.github/workflows/grampsweb-deploy.yml'
  workflow_call:
    inputs:
      host_machine:
        required: true
        type: string 
      domain:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      host_machine:
        required: true
        type: string 
      domain:
        required: true
        type: string   
jobs:
  database_create:
    env:
      host_machine: ${{ inputs.host_machine || 'e7270-server' }}
      domain: ${{ inputs.domain || 'familytree.james-fagg.uk' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2
      
      - name: Set node config
        id: node_config
        run: |
          if [ "${{ env.host_machine }}" = "rpi4-server" ]; then
            echo "ssh_host=${{ vars.RPI4_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.RPI4_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_RPI4 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          elif [ "${{ env.host_machine }}" = "e7270-server" ]; then
            echo "ssh_host=${{ vars.E7270_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.E7270_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_E7270 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          fi
     
      - name: Write SSH key to file
        run: |
          echo "${{ steps.node_config.outputs.ssh_key }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)  

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 10.5.5.5/32
          DNS = 10.5.5.1
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, ${{ steps.node_config.outputs.ssh_host }}/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN on runner
        run: |
          success=false
          for i in 1 2 3 4 5; do
            if sudo wg-quick up ./wg0.conf; then
              success=true
              break
            fi
            echo "wg-quick up failed (attempt $i/5). Retrying in 5s..."
            sleep 5
          done
          if [ "$success" != true ]; then
            echo "::error::wg-quick up failed after 5 attempts"
            exit 1
          fi

          for i in 1 2 3 4 5; do
            if sudo wg show wg0 latest-handshakes | grep -qv '^\s*[a-zA-Z0-9+/=]*\s*0$'; then
              break
            fi
            echo "No WireGuard handshake yet (attempt $i/5). Waiting 2s..."
            sleep 2
          done
          sudo wg show

      - name: Override system DNS resolver on runner
        run: |
          sudo rm /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf

      - name: Check postgres is up
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          script: |
            sudo docker exec postgres pg_isready -U svc_gitopsdeploy

      - name: Create Gramps database and user if not exists
        uses: appleboy/ssh-action@v1.2.5
        env:
          POSTGRES_DEPLOYMENT_USER: svc_gitopsdeploy
          POSTGRES_DEPLOYMENT_USER_PASSWORD: ${{ secrets.svc_gitopsdeploy_password }}
          POSTGRES_APP_DB_NAME: James-Fagg_Family
          POSTGRES_APP_USER: svc_grampsweb
          POSTGRES_APP_PASSWORD: ${{ secrets.svc_grampsweb_password }}
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          envs: POSTGRES_APP_USER,POSTGRES_APP_PASSWORD,POSTGRES_APP_DB_NAME
          script: |
            docker exec -i postgres psql -U svc_gitopsdeploy -d postgres_db -v ON_ERROR_STOP=1 \
              -v dbuser="$POSTGRES_APP_USER" \
              -v dbpass="$POSTGRES_APP_PASSWORD" \
              -v dbname="$POSTGRES_APP_DB_NAME" <<'SQL'
            SELECT 'CREATE ROLE ' || quote_ident(:'dbuser') || ' WITH LOGIN PASSWORD ' || quote_literal(:'dbpass')
            WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = :'dbuser')
            \gexec
            GRANT :"dbuser" TO CURRENT_USER WITH SET TRUE;
            
            SELECT 'CREATE DATABASE ' || quote_ident(:'dbname') || ' OWNER ' || quote_ident(:'dbuser')
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'dbname')
            \gexec
            SQL


      - name: Create Grampsweb_search database and user if not exists
        uses: appleboy/ssh-action@v1.2.5
        env:
          POSTGRES_DEPLOYMENT_USER: svc_gitopsdeploy
          POSTGRES_DEPLOYMENT_USER_PASSWORD: ${{ secrets.svc_gitopsdeploy_password }}
          POSTGRES_APP_DB_NAME: grampsweb_search
          POSTGRES_APP_USER: svc_grampsweb
          POSTGRES_APP_PASSWORD: ${{ secrets.svc_grampsweb_password }}
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          envs: POSTGRES_APP_USER,POSTGRES_APP_PASSWORD,POSTGRES_APP_DB_NAME
          script: |
            docker exec -i postgres psql -U svc_gitopsdeploy -d postgres_db -v ON_ERROR_STOP=1 \
              -v dbuser="$POSTGRES_APP_USER" \
              -v dbpass="$POSTGRES_APP_PASSWORD" \
              -v dbname="$POSTGRES_APP_DB_NAME" <<'SQL'
            SELECT 'CREATE ROLE ' || quote_ident(:'dbuser') || ' WITH LOGIN PASSWORD ' || quote_literal(:'dbpass')
            WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = :'dbuser')
            \gexec
            GRANT :"dbuser" TO CURRENT_USER WITH SET TRUE;
            
            SELECT 'CREATE DATABASE ' || quote_ident(:'dbname') || ' OWNER ' || quote_ident(:'dbuser')
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'dbname')
            \gexec
            SQL

      - name: Create Grampsweb_users database and user if not exists
        uses: appleboy/ssh-action@v1.2.5
        env:
          POSTGRES_DEPLOYMENT_USER: svc_gitopsdeploy
          POSTGRES_DEPLOYMENT_USER_PASSWORD: ${{ secrets.svc_gitopsdeploy_password }}
          POSTGRES_APP_DB_NAME: grampsweb_users
          POSTGRES_APP_USER: svc_grampsweb
          POSTGRES_APP_PASSWORD: ${{ secrets.svc_grampsweb_password }}
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          envs: POSTGRES_APP_USER,POSTGRES_APP_PASSWORD,POSTGRES_APP_DB_NAME
          script: |
            docker exec -i postgres psql -U svc_gitopsdeploy -d postgres_db -v ON_ERROR_STOP=1 \
              -v dbuser="$POSTGRES_APP_USER" \
              -v dbpass="$POSTGRES_APP_PASSWORD" \
              -v dbname="$POSTGRES_APP_DB_NAME" <<'SQL'
            SELECT 'CREATE ROLE ' || quote_ident(:'dbuser') || ' WITH LOGIN PASSWORD ' || quote_literal(:'dbpass')
            WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = :'dbuser')
            \gexec
            GRANT :"dbuser" TO CURRENT_USER WITH SET TRUE;
            
            SELECT 'CREATE DATABASE ' || quote_ident(:'dbname') || ' OWNER ' || quote_ident(:'dbuser')
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'dbname')
            \gexec
            SQL

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show

  deploy:
    runs-on: ubuntu-latest
    needs: database_create
    env:
      host_machine: ${{ inputs.host_machine || 'e7270-server' }}
      domain: ${{ inputs.domain || '14monarch.james-fagg.uk' }}
    steps:
      - name: Set node config
        id: node_config
        run: |
            echo "ssh_host=${{ vars.E7270_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.E7270_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_E7270 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT

      - name: Write SSH key to file
        run: |
          echo "${{ steps.node_config.outputs.ssh_key }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key


      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)  

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 10.5.5.5/32
          DNS = 10.5.5.1
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, 145.241.244.229/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5: bringing up WireGuard..."
            if sudo wg-quick up ./wg0.conf; then
              echo "WireGuard up successfully"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "WireGuard failed after 5 attempts"
              exit 1
            fi
            echo "Failed, waiting 10s before retry..."
            sudo ip link delete dev wg0 2>/dev/null || true
            sleep 10
          done
          sudo wg show
          
      - name: Override system DNS resolver
        run: |
          sudo rm /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
            
      - name: Authenticate to Portainer
        id: auth
        run: |
          RESPONSE=$(curl -X POST "${{ vars.RPI4_IP }}:83/api/auth" \
            -H "Content-Type: application/json" \
            -d '{
                 "Username":"${{ vars.APP_USER }}", 
                 "Password":"${{ secrets.APP_PASSWORD }}"
                }')
          TOKEN=$(echo "$RESPONSE" | jq -r '.jwt')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Get Portainer EndpointId
        id: endpoint
        env:
          HOST_MACHINE: ${{ inputs.host_machine || 'e7270-server' }}
        run: |
          echo "Looking for endpoint with name: $HOST_MACHINE"
          RESPONSE=$(curl -Ss -X GET "http://${{ vars.RPI4_IP }}:83/api/endpoints" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          ENDPOINT_ID=$(echo "$RESPONSE" | jq -r --arg host_machine "$host_machine" '.[] | select(.Name==$host_machine) | .Id')
          echo "endpoint_id=$ENDPOINT_ID" >> $GITHUB_OUTPUT

      - name: Get Stack ID (if exists)
        id: get_stack_id
        run: |
          STACKS=$(curl --fail -Ss -X GET "http://${{ vars.RPI4_IP }}:83/api/stacks" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" || echo "[]")

          # Filter by both Name AND EndpointId
          STACK_ID=$(echo "$STACKS" | jq -r '.[] | select(.Name=="grampsweb" and .EndpointId==${{ steps.endpoint.outputs.endpoint_id }}) | .Id')
          
          if [ -z "$STACK_ID" ] || [ "$STACK_ID" = "null" ]; then
            echo "Stack not found for this endpoint."
            echo "stack_id=0" >> $GITHUB_OUTPUT
          else
            echo "Stack found with ID: $STACK_ID" 
            echo "stack_id=$STACK_ID" >> $GITHUB_OUTPUT
          fi

      - name: Get stack webhook token
        if: ${{ steps.get_stack_id.outputs.stack_id != '0' }}
        id: get_webhook
        run: |
          WEBHOOK_TOKEN=$(curl -Ss \
            --max-time 10 \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            "http://192.168.0.2:83/api/stacks/${{ steps.get_stack_id.outputs.stack_id }}?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
            | jq -r '.AutoUpdate.Webhook')

          echo "Webhook token: $WEBHOOK_TOKEN"
          echo "webhook_token=$WEBHOOK_TOKEN" >> $GITHUB_OUTPUT          
          
      - name: Generate UUID
        if: ${{ steps.get_stack_id.outputs.stack_id == '0' }}
        id: uuid
        run: |
          echo "uuid=$(uuidgen)" >> $GITHUB_OUTPUT

      - name: Create Stack from GitHub
        if: ${{ steps.get_stack_id.outputs.stack_id == '0' }}
        run: |
          echo "Creating stack from GitHub..."
          RESPONSE=$(curl -v -Ss -X POST "http://${{ vars.RPI4_IP }}:83/api/stacks/create/standalone/repository?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
          -H "Content-Type: application/json" \
          -d '{
               "Name": "grampsweb",
               "RepositoryURL": "https://github.com/liamj-f/homelab-setup",
               "RepositoryReferenceName": "${{ github.ref }}",
               "ComposeFile": "grampsweb/grampsweb-compose.yml",
               "RepositoryAuthentication": false,
               "AutoUpdate": {
                              "forcePullImage": true,
                              "forceUpdate": true,
                              "Webhook": "${{ steps.uuid.outputs.uuid }}"
                             },
               "Prune": true,
               "StackFileVersion": "3",
               "Env": [
                        {"name": "svc_grampsweb_password", "value": "${{ secrets.SVC_GRAMPSWEB_PASSWORD }}"},
                        {"name": "grampsweb_secret_key", "value": "${{ secrets.GRAMPSWEB_SECRET_KEY }}"},
                        {"name": "grampsweb_email_address", "value": "${{ vars.GRAMPSWEB_EMAIL_ADDRESS }}"},
                        {"name": "gmail_address", "value": "${{ vars.GMAIL_ADDRESS }}"},
                        {"name": "gmail_app_password", "value": "${{ secrets.GRAMPSWEB_GMAIL_APP_PASSWORD }}"},
                        {"name": "gcp_oauth_client_id", "value": "${{ secrets.GCP_OAUTH_CLIENT_ID }}"},
                        {"name": "gcp_oauth_client_secret", "value": "${{ secrets.GCP_OAUTH_CLIENT_SECRET }}"}
                      ]

              }')
            echo "API Response: $RESPONSE"
            echo "stack_response=$RESPONSE" >> $GITHUB_OUTPUT

      - name: Update Environment Variables
        if: ${{ steps.get_stack_id.outputs.stack_id != '0' }}
        run: |
          curl -Ss -X PUT "http://${{ vars.RPI4_IP }}:83/api/stacks/${{ steps.get_stack_id.outputs.stack_id }}/git/redeploy?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
          -H "Content-Type: application/json" \
            -d '{
                  "AutoUpdate": {
                          "forcePullImage": false,
                          "forceUpdate": true,
                          "Webhook": "${{ steps.get_webhook.outputs.webhook_token }}"
                          },               
               "PullImage": true,
               "RepositoryReferenceName": "${{ github.ref }}",
               "RepositoryAuthentication": false,
               "Prune": true,
               "Env": [
                        {"name": "svc_grampsweb_password", "value": "${{ secrets.SVC_GRAMPSWEB_PASSWORD }}"},
                        {"name": "grampsweb_secret_key", "value": "${{ secrets.GRAMPSWEB_SECRET_KEY }}"},
                        {"name": "grampsweb_email_address", "value": "${{ vars.GRAMPSWEB_EMAIL_ADDRESS }}"},
                        {"name": "gmail_address", "value": "${{ vars.GMAIL_ADDRESS }}"},
                        {"name": "gmail_app_password", "value": "${{ secrets.GRAMPSWEB_GMAIL_APP_PASSWORD }}"},
                        {"name": "gcp_oauth_client_id", "value": "${{ secrets.GCP_OAUTH_CLIENT_ID }}"},
                        {"name": "gcp_oauth_client_secret", "value": "${{ secrets.GCP_OAUTH_CLIENT_SECRET }}"}
                      ]
              }'          

#      - name: Redeploy Stack using webhook
#        if: ${{ steps.get_stack_id.outputs.stack_id != '0' }}
#        run: |
#          RESPONSE=$(curl -s -i -v --max-time 300 -X POST "http://${{ vars.RPI4_IP }}:83/api/stacks/webhooks/${{ steps.get_webhook.outputs.webhook_token }}?pullimage=true" \
#          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" )
#
#          echo "API Response: $RESPONSE"

      - name: Wait for GrampsWeb to be ready
        run: |
          for i in $(seq 1 24); do
            if curl -sf "http://${{ vars.E7270_IP }}:88/api/metadata/" > /dev/null; then
              echo "GrampsWeb is up"
              break
            fi
            echo "Attempt $i/24: grampsweb not up yet, waiting 5s..."
            sleep 5
          done

      # In single-tree mode (GRAMPSWEB_TREE set to a fixed name, not "*"),
      # create_owner assigns the configured tree to the new user
      # automatically - no separate tree-creation/login dance needed, and
      # no deadlock. This endpoint only succeeds once (it 405s with "Users
      # already exist" the moment any user exists anywhere), so on repeat
      # deploys this step is a no-op rather than resyncing the existing
      # owner's password/role.
      - name: Bootstrap owner user
        run: |
          RESPONSE=$(curl -sS -X POST "http://${{ vars.E7270_IP }}:88/api/token/create_owner/" \
            -H "Content-Type: application/json" \
            -d '{}')
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "Owner already exists, skipping bootstrap: $RESPONSE"
            exit 0
          fi

          curl -sS --fail -X POST "http://${{ vars.E7270_IP }}:88/api/users/admin/create_owner/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
                 "password": "${{ secrets.APP_PASSWORD }}",
                 "email": "${{ vars.HOMELAB_EMAIL }}",
                 "full_name": "${{ vars.APP_USER }}"
                }'
          echo "Owner user created"

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show

  f2b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SSH_KEY_E7270 }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 10.5.5.5/32
          DNS = 10.5.5.1
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, ${{ vars.E7270_IP }}/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5: bringing up WireGuard..."
            if sudo wg-quick up ./wg0.conf; then
              echo "WireGuard up successfully"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "WireGuard failed after 5 attempts"
              exit 1
            fi
            echo "Failed, waiting 10s before retry..."
            sudo ip link delete dev wg0 2>/dev/null || true
            sleep 10
          done
          sudo wg show

      - name: make log directory
        uses: appleboy/ssh-action@v1.2.5
        with:
            host: ${{ vars.E7270_IP }}
            username: ${{ vars.E7270_USER }}
            key: ${{ secrets.SSH_KEY_E7270 }}
            script:
              sudo mkdir -p /opt/f2b-logs/grampsweb

      - name: Copy f2b filter to host
        uses: appleboy/scp-action@v1.0.0
        with:
            host: ${{ vars.E7270_IP }}
            username: ${{ vars.E7270_USER }}
            key: ${{ secrets.SSH_KEY_E7270 }}
            source: "grampsweb/filter.d/grampsweb.local"
            target: "/opt/stacks/fail2ban/data/filter.d/"
            strip_components: 2

      - name: Copy f2b jail to host
        uses: appleboy/scp-action@v1.0.0
        with:
            host: ${{ vars.E7270_IP }}
            username: ${{ vars.E7270_USER }}
            key: ${{ secrets.SSH_KEY_E7270 }}
            source: "grampsweb/jail.d/grampsweb.local"
            target: "/opt/stacks/fail2ban/data/jail.d/"
            strip_components: 2

      - name: Reload f2b
        uses: appleboy/ssh-action@v1.2.5
        with:
            host: ${{ vars.E7270_IP }}
            username: ${{ vars.E7270_USER }}
            key: ${{ secrets.SSH_KEY_E7270 }}
            script:
              docker exec fail2ban fail2ban-client reload

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show
