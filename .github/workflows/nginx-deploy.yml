
name: Deploy Nginx-Proxy-Manager 
on:
  workflow_dispatch:
    inputs:
      domain:
        required: false
        type: string
        default: 'nginx.14monarch.james-fagg.uk'
      stack_name:
        required: false
        type: string
        # Portainer already holds this stack under its capitalized name -
        # keep the default matching that, since Get Stack ID's lookup is
        # case-sensitive and a mismatch would create a duplicate stack.
        default: 'nginx'
  workflow_call:
    inputs:
      domain:
        required: false
        type: string
        default: 'nginx.14monarch.james-fagg.uk'
      stack_name:
        required: false
        type: string
        default: 'nginx'
  push:
    branches:
      - main
      - '**'
    paths:
      - '.github/workflows/nginx-deploy.yml'
      - 'nginx/**'
env:
  domain: ${{ inputs.domain || 'nginx.14monarch.james-fagg.uk' }}
  stack_name: ${{ inputs.stack_name || 'nginx' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-deployments
      cancel-in-progress: false
      queue: max
    strategy:
      matrix:
        host_machine: [ rpi4-server, e7270-server, ljfcloud-arm ]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      
      - name: Set node config
        id: node_config
        run: |
          if [ "${{ matrix.host_machine }}" = "rpi4-server" ]; then
            echo "ssh_host=${{ vars.RPI4_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.RPI4_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_RPI4 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.host_machine }}" = "e7270-server" ]; then
            echo "ssh_host=${{ vars.E7270_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.E7270_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_E7270 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.host_machine }}" = "ljfcloud-arm" ]; then
            echo "ssh_host=${{ vars.IP_LJFCLOUD_ARM }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.LJFCLOUD_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_LJFCLOUD_ARM }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          fi

      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)  

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 192.168.2.2/30
          DNS = ${{ vars.Keepalived_IP }}
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, ${{ vars.IP_LJFCLOUD_ARM }}/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN on runner
        run: |
          success=false
          for i in 1 2 3 4 5; do
            if sudo wg-quick up ./wg0.conf; then
              success=true
              break
            fi
            echo "wg-quick up failed (attempt $i/5). Retrying in 5s..."
            sleep 5
          done
          if [ "$success" != true ]; then
            echo "::error::wg-quick up failed after 5 attempts"
            exit 1
          fi

          for i in 1 2 3 4 5; do
            if sudo wg show wg0 latest-handshakes | grep -qv '^\s*[a-zA-Z0-9+/=]*\s*0$'; then
              break
            fi
            echo "No WireGuard handshake yet (attempt $i/5). Waiting 2s..."
            sleep 2
          done
          sudo wg show

      - name: Override system DNS resolver on runner
        run: |
          sudo rm /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
      - name: Authenticate to Portainer
        id: auth
        run: |
          RESPONSE=$(curl --retry 3 --retry-delay 5 --retry-all-errors -X POST "${{ vars.RPI4_IP }}:83/api/auth" \
            -H "Content-Type: application/json" \
            -d '{
                 "Username":"${{ vars.APP_USER }}", 
                 "Password":"${{ secrets.APP_PASSWORD }}"
                }')
          TOKEN=$(echo "$RESPONSE" | jq -r '.jwt')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Get Portainer EndpointId
        id: endpoint
        env:
          host_machine: ${{ matrix.host_machine || 'rpi4-server' }}
        run: |
          echo "Looking for endpoint with name: $host_machine"
          RESPONSE=$(curl -s -X GET "http://${{ vars.RPI4_IP }}:83/api/endpoints" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          ENDPOINT_ID=$(echo "$RESPONSE" | jq -r --arg host_machine "$host_machine" '.[] | select(.Name==$host_machine) | .Id')
          echo "endpoint_id=$ENDPOINT_ID" >> $GITHUB_OUTPUT

      - name: See if Nginx network exists
        id: check_network
        run: |
          NETWORKS=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s -X GET "http://${{ vars.RPI4_IP }}:83/api/endpoints/${{ steps.endpoint.outputs.endpoint_id }}/docker/networks" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          
          if echo "$NETWORKS" | jq -e '.[] | select(.Name=="nginx_network")' > /dev/null; then
            echo "Network found."
            echo "network_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Network not found."
            echo "network_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create nginx_network
        if: steps.check_network.outputs.network_exists == 'false'
        run: |
          RESPONSE=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s -X POST "http://${{ vars.RPI4_IP }}:83/api/endpoints/${{ steps.endpoint.outputs.endpoint_id }}/docker/networks/create" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
          -H "Content-Type: application/json" \
          -d '{
               "Name": "nginx_network",
               "Driver": "bridge",
               "CheckDuplicate": true,
               "Options": {
                 "com.docker.network.enable_ipv6": "false"
                          }
              }'
              )

      - name: Get Stack ID (if exists)
        id: get_stack_id
        run: |
          STACKS=$(curl --fail -s -X GET "http://${{ vars.RPI4_IP }}:83/api/stacks" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" || echo "[]")

          # Filter by both Name AND EndpointId
          STACK_ID=$(echo "$STACKS" | jq -r '.[] | select(.Name=="${{ env.stack_name }}" and .EndpointId==${{ steps.endpoint.outputs.endpoint_id }}) | .Id')
          
          if [ -z "$STACK_ID" ] || [ "$STACK_ID" = "null" ]; then
            echo "Stack not found for this endpoint."
            echo "stack_id=0" >> $GITHUB_OUTPUT
          else
            echo "Stack found with ID: $STACK_ID" 
            echo "stack_id=$STACK_ID" >> $GITHUB_OUTPUT
          fi

      - name: Get stack webhook token
        if: ${{ steps.get_stack_id.outputs.stack_id != '0' }}
        id: get_webhook
        run: |
          WEBHOOK_TOKEN=$(curl -s \
            --max-time 10 \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            "http://192.168.0.2:83/api/stacks/${{ steps.get_stack_id.outputs.stack_id }}?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
            | jq -r '.AutoUpdate.Webhook')

          echo "Webhook token: $WEBHOOK_TOKEN"
          echo "webhook_token=$WEBHOOK_TOKEN" >> $GITHUB_OUTPUT

      - name: Generate UUID
        if: ${{ steps.get_stack_id.outputs.stack_id == '0' }}
        id: uuid
        run: |
          echo "uuid=$(uuidgen)" >> $GITHUB_OUTPUT

      - name: Create Stack from GitHub
        if: ${{ steps.get_stack_id.outputs.stack_id == '0' }}
        run: |
          echo "Creating stack from GitHub..."
          
          CREATE_STACK_PAYLOAD=$(jq -n \
            --arg ref "${{ github.ref }}" \
            --arg webhook "${{ steps.uuid.outputs.uuid }}" \
            --arg app_password "${{ secrets.APP_PASSWORD }}" \
            --arg homelab_email "${{ vars.homelab_EMAIL }}" \
            --arg hostname "${{ matrix.host_machine }}" \
            --arg stack_name "${{ env.stack_name }}" \
            '{
            Name: $stack_name,
            RepositoryURL: "https://github.com/liamj-f/homelab-setup",
            RepositoryReferenceName: $ref,
            ComposeFile: "$stack_name/$stack_name-compose.yml",
            RepositoryAuthentication: false,
            RepullImageAndRedeploy: true,
            AutoUpdate: {
                          "forcePullImage": true,
                          "forceUpdate": true,
                          "Webhook": $webhook
                          },
              Env: [
                {name: "INITIAL_ADMIN_EMAIL", value: $homelab_email},
                {name: "INITIAL_ADMIN_PASSWORD", value: $app_password},
                {name: "HOSTNAME",            value: $hostname}
              ],
            Prune: true,
            StackFileVersion: "3"
          }')      

          RESPONSE=$(curl --retry 3 --retry-delay 5 --retry-all-errors -v -s -S -X POST "http://${{ vars.RPI4_IP }}:83/api/stacks/create/standalone/repository?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
          -H "Content-Type: application/json" \
          -d "$CREATE_STACK_PAYLOAD")

          echo "API Response: $RESPONSE"

      - name: Update Stack Environment Variables
        if: ${{ steps.get_stack_id.outputs.stack_id != '0' }}
        run: |
            UPDATE_STACK_PAYLOAD=$(jq -n \
            --arg ref "${{ github.ref }}" \
            --arg webhook "${{ steps.uuid.outputs.uuid }}" \
            --arg app_password "${{ secrets.APP_PASSWORD }}" \
            --arg homelab_email "${{ vars.homelab_EMAIL }}" \
            --arg hostname "${{ matrix.host_machine }}" \
            '{
              AutoUpdate: {
                    ForcePullImage: true,
                    ForceUpdate: true,
                    Webhook: $webhook
                    },
              PullImage: true,
              RepositoryReferenceName: $ref,
              repositoryAuthentication: false,
              Env: [
                {name: "INITIAL_ADMIN_EMAIL", value: $homelab_email},
                {name: "INITIAL_ADMIN_PASSWORD", value: $app_password},
                {name: "HOSTNAME",            value: $hostname}
              ],
              Prune: true
              }')

            RESPONSE=$(curl -s -i -v --max-time 300 -X PUT "http://${{ vars.RPI4_IP }}:83/api/stacks/${{ steps.get_stack_id.outputs.stack_id }}/git/redeploy?endpointId=${{ steps.endpoint.outputs.endpoint_id }}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "$UPDATE_STACK_PAYLOAD")

            echo "API Response: $RESPONSE" 
     
      - name: Copy NGINX XFF config to host
        uses: appleboy/scp-action@v1.0.0
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            debug: true
            source: "${{ env.stack_name }}/http_top.conf"
            target: "/tmp/"

      - name: Wait for NPM to be healthy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          script: |
            for i in $(seq 1 25); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' nginx-proxy-manager 2>/dev/null)

              echo "Attempt $i/25: NPM health = $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "NPM is healthy"
                exit 0
              fi
              sleep 5
            done

            echo "NPM did not become healthy in time"
            exit 1
              
      - name: Load config into NPM container and reload
        uses: appleboy/ssh-action@v1.2.5
        with:
            host: ${{ steps.node_config.outputs.ssh_host }}
            username: ${{ steps.node_config.outputs.ssh_user }}
            key: ${{ steps.node_config.outputs.ssh_key }}
            script: |
                docker exec nginx-proxy-manager mkdir -p /data/nginx/custom
                docker cp /tmp/${{ env.stack_name }}/http_top.conf nginx-proxy-manager:/data/nginx/custom/http_top.conf
                rm /tmp/${{ env.stack_name }}/http_top.conf
                docker exec nginx-proxy-manager nginx -s reload

      - name: Authenticate as nginx user
        id: token
        run: |
          RESPONSE=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s -X POST "http://${{ steps.node_config.outputs.ssh_host }}:81/api/tokens" \
            -H "Content-Type: application/json" \
            -d '{
                 "identity":"${{ vars.NGINX_EMAIL }}",
                 "secret":"${{ secrets.APP_PASSWORD }}"
                 }')
        
          TOKEN=$(echo "$RESPONSE" | jq -r '.token // empty')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Set NPM default site
        run: |
            RESPONSE=$(curl -X PUT "http://${{ steps.node_config.outputs.ssh_host }}:81/api/settings/default-site" \
            -H 'Authorization: Bearer ${{ steps.token.outputs.token }}' \
            -H 'Content-Type: application/json' \
            -d '{
              "value": "html",
              "meta": {
                "html": "<body>\n<pre>{ \"code\":\"404\",\"message\":\"No route to host\",\"source\":\"${{ matrix.host_machine }}\" }\n</pre>\n</body>"
              }
              }')

              echo $RESPONSE

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show   
          
  proxy_setup_onprem:
    needs: deploy
    uses: ./.github/workflows/proxy_config_onprem.yml
    secrets: inherit
    with:
      domain: ${{ inputs.domain || 'nginx.14monarch.james-fagg.uk' }}
      forward_host: ${{ vars.KEEPALIVED_IP }}
      forward_port: 81
      mesh_prefix: 'nginx'
  proxy_setup_oci:
    # This step adds nginx1, nginx2 and nginx.14monarch.james-fagg.uk to the OCI nginx.
    needs: deploy
    uses: ./.github/workflows/proxy_config_oci.yml
    secrets: inherit
    with:
      domain: ${{ inputs.domain || 'nginx.14monarch.james-fagg.uk' }}
      extra_domain_prefixes: 'nginx1,nginx2'
      # nginx1/nginx2 are the on-prem NPM instances (rpi4/e7270), always
      # reached over the rathole tunnel - this pipeline has no host_machine
      # input of its own, so 'rpi4-server' here is just an on-prem sentinel.
      host_machine: 'rpi4-server'

  proxy_setup_oci_2:
    # This step adds nginx.oci.james-fagg.uk to the OCI Nginx.
    needs: deploy
    uses: ./.github/workflows/proxy_config_oci.yml
    secrets: inherit
    with:
      domain: 'nginx.oci.james-fagg.uk'
      # This is ljfcloud-arm's own NPM default site, not an on-prem service.
      host_machine: 'ljfcloud-arm'
      forward_host: '127.0.0.1'
      forward_port: 81







