      # --- Authentik SSO: protect Portainer behind OIDC ---
      # Declares Portainer's OAuth2 provider + application in authentik as a
      # blueprint (same client id/secret used below when wiring Portainer's
      # OAuth settings), then flips Portainer over to OIDC authentication.
      - name: Render Portainer authentik blueprint
        run: |
          export AUTHENTIK_PORTAINER_CLIENT_ID="${{ secrets.AUTHENTIK_PORTAINER_CLIENT_ID }}"
          export AUTHENTIK_PORTAINER_CLIENT_SECRET="${{ secrets.AUTHENTIK_PORTAINER_CLIENT_SECRET }}"
          export PORTAINER_DOMAIN="${{ vars.PORTAINER_DOMAIN }}"
          envsubst < authentik/blueprints/portainer-provider.yaml.template > portainer-provider.yaml

      - name: Copy blueprint to Authentik host
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.E7270_IP }}
          username: ${{ vars.E7270_USER }}
          key: ${{ secrets.SSH_KEY_E7270 }}
          source: portainer-provider.yaml
          target: /opt/stacks/authentik/blueprints/
          overwrite: true

      - name: Wait for Authentik to pick up the blueprint
        run: |
          for i in $(seq 1 12); do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ vars.AUTHENTIK_DOMAIN }}/application/o/portainer/.well-known/openid-configuration" || echo "000")
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "Portainer application is live in authentik"
              break
            fi
            echo "Attempt $i/12: application not visible yet (HTTP $STATUS_CODE), waiting 10s..."
            sleep 10
          done

      - name: Configure Portainer to use Authentik OIDC
        run: |
          CURRENT=$(curl -s -X GET "http://${{ vars.RPI4_IP }}:83/api/settings" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")

          UPDATED=$(echo "$CURRENT" | jq \
            --arg client_id "${{ secrets.AUTHENTIK_PORTAINER_CLIENT_ID }}" \
            --arg client_secret "${{ secrets.AUTHENTIK_PORTAINER_CLIENT_SECRET }}" \
            --arg auth_uri "https://${{ vars.AUTHENTIK_DOMAIN }}/application/o/authorize/" \
            --arg token_uri "https://${{ vars.AUTHENTIK_DOMAIN }}/application/o/token/" \
            --arg userinfo_uri "https://${{ vars.AUTHENTIK_DOMAIN }}/application/o/userinfo/" \
            --arg logout_uri "https://${{ vars.AUTHENTIK_DOMAIN }}/application/o/portainer/end-session/" \
            --arg redirect_uri "https://${{ vars.PORTAINER_DOMAIN }}/" \
            '.AuthenticationMethod = 3 | .OAuthSettings = {
               ClientID: $client_id,
               ClientSecret: $client_secret,
               AccessTokenURI: $token_uri,
               AuthorizationURI: $auth_uri,
               ResourceURI: $userinfo_uri,
               RedirectURI: $redirect_uri,
               LogoutURI: $logout_uri,
               UserIdentifier: "email",
               Scopes: "openid email profile",
               OAuthAutoCreateUsers: true,
               DefaultTeamID: 0,
               SSO: true,
               AuthStyle: 0
            }')

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "http://${{ vars.RPI4_IP }}:83/api/settings" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "$UPDATED")

          echo "Portainer settings API response: $RESPONSE"

      - name: Bring down VPN
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show


