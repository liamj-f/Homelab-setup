name: Redeploy Portainer via Docker Compose
on:
  push:
    branches:
      - main
      - '**'
    paths:
      - 'portainer/**'
      - '.github/workflows/portainer-deploy.yml'
  workflow_dispatch:
    inputs:
      host_machine:
        required: true
        type: string 
        default: 'rpi4-server'
      domain:
        required: true
        type: string  
        default: 'portainer.14monarch.james-fagg.uk'
  workflow_call:
    inputs:
      host_machine:
        required: true
        type: string 
        default: 'rpi4-server'
      domain:
        required: true
        type: string
        default: 'portainer.14monarch.james-fagg.uk'
env:
  domain: ${{ inputs.domain || 'portainer.14monarch.james-fagg.uk' }}
  host_machine: ${{ inputs.host_machine || 'rpi4-server' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-deployments
      cancel-in-progress: false
      queue: max   
    strategy:
      matrix:
        host_machine: ['rpi4-server','e7270-server','ljfcloud-arm']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)  
      
      - name: Set node config
        id: node_config
        run: |
          if [ "${{ matrix.host_machine }}" = "rpi4-server" ]; then
            echo "ssh_host=${{ vars.RPI4_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.RPI4_USER }}" >> $GITHUB_OUTPUT
            echo "compose_filepath=portainer/portainer-compose.yml" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_RPI4 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.host_machine }}" = "e7270-server" ]; then
            echo "ssh_host=${{ vars.E7270_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.E7270_USER }}" >> $GITHUB_OUTPUT
            echo "compose_filepath=portainer/portainer-agent-compose.yml" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_E7270 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.host_machine }}" = "ljfcloud-arm" ]; then
            echo "ssh_host=${{ vars.IP_LJFCLOUD_ARM }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.LJFCLOUD_USER }}" >> $GITHUB_OUTPUT
            echo "compose_filepath=portainer/portainer-agent-compose.yml" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_LJFCLOUD_ARM }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          fi

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 192.168.2.2/30
          DNS = ${{ vars.Keepalived_IP }}
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, ${{ steps.node_config.outputs.ssh_host }}/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5: bringing up WireGuard..."
            if sudo wg-quick up ./wg0.conf; then
              echo "WireGuard up successfully"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "WireGuard failed after 5 attempts"
              exit 1
            fi
            echo "Failed, waiting 10s before retry..."
            sudo ip link delete dev wg0 2>/dev/null || true
            sleep 10
          done
          sudo wg show
          
      - name: Override system DNS resolver
        run: |
          sudo rm /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf

      - name: Render Portainer compose
        run: |
          envsubst < ${{ steps.node_config.outputs.compose_filepath }} > portainer-compose-rendered.yml
          
      - name: Copy rendered compose
        uses: appleboy/scp-action@master
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          source: portainer-compose-rendered.yml
          target: ~/stacks/portainer/
          overwrite: true
          
      - name: Deploy via SSH
        id: deploy_portainer
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          script: |
            cd ~/stacks/portainer
            sudo docker compose -f portainer-compose-rendered.yml up -d
            
      - name: Create Admin Account if required
        if: ${{ matrix.host_machine == 'rpi4-server' }}
        id: check_admin
        run: |
          echo "Waiting for Portainer API to be ready..."
          STATUS_CODE=000
          for i in {1..20}; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ vars.RPI4_IP }}:83/api/users/admin/check || echo "000")
            if [ "$STATUS_CODE" -ne 000 ]; then
              echo "Portainer API is responding (HTTP $STATUS_CODE)"
            break
            fi
            echo "Attempt $i: Portainer not ready yet... retrying in 5s"
            sleep 5
          done

          if [ "$STATUS_CODE" -eq 000 ]; then
            echo "Portainer API did not respond after multiple retries. Failing job."
          exit 1
          fi
          if [ "$STATUS_CODE" -eq 204 ]; then
            echo "Admin account is already initialized."
          else
            echo "Admin account is not initialized. Creating..."
            curl -s -X POST "${{ vars.RPI4_IP }}:83/api/users/admin/init" \
            -H "Content-Type: application/json" \
            -d '{
                 "Username": "${{ vars.APP_USER }}", 
                 "Password": "${{ secrets.APP_PASSWORD }}"
                 }'
          fi  

      - name: Authenticate with Portainer
        id: auth
        if: ${{ steps.check_admin.outcome == 'success' }}
        run: |
          RESPONSE=$(curl -s -X POST "${{ vars.RPI4_IP }}:83/api/auth" \
            -H "Content-Type: application/json" \
            -d  '{
                "Username": "${{ vars.APP_USER }}", 
                "Password": "${{ secrets.APP_PASSWORD }}"
                }')
          TOKEN=$(echo "$RESPONSE" | jq -r '.jwt')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          
      - name: Check Status
        id: check_status
        if: ${{ steps.auth.outcome == 'success' }}
        run: |
          curl -s -X get "${{ vars.RPI4_IP }}:83/api/status" \
           -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" | jq .
           
      - name: Create Docker Environment if required
        if: ${{ steps.check_status.outcome == 'success' }}
        id: check_env
        run: |
          ENDPOINTS=$(curl -s -X GET "http://${{ vars.RPI4_IP }}:83/api/endpoints" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
      
          echo "$ENDPOINTS" | jq .
      
          ID=$(echo "$ENDPOINTS" | jq -r '.[] | select(.URL=="unix:///var/run/docker.sock") | .Id')
      
          if [ -z "$ID" ]; then
            echo "No Docker endpoint found. Creating..."
            curl -s -X POST http://${{ vars.RPI4_IP }}:83/api/endpoints \
              -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
              -F "Name=$host_machine" \
              -F "EndpointCreationType=1" \
              -F "ContainerEngine=docker"
          else
            echo "Found Docker endpoint with ID: $ID"
            echo "endpoint_id=$ID" >> $GITHUB_OUTPUT
          fi
          
      - name: Check Authelia health across Portainer endpoints
        id: check_authelia
        if: ${{ matrix.host_machine == 'rpi4-server' && steps.auth.outcome == 'success' }}
        run: |
          FOUND="false"
          ENDPOINT_IDS=$(curl -s -X GET "http://${{ vars.RPI4_IP }}:83/api/endpoints" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" | jq -r '.[].Id')

          for id in $ENDPOINT_IDS; do
            HEALTHY=$(curl -s -X GET "http://${{ vars.RPI4_IP }}:83/api/endpoints/$id/docker/containers/json?all=1" \
              -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
              | jq -r '[.[]? | select((.Names[]? == "/authelia") and .State == "running" and .Health.Status == "healthy")] | length > 0')
            if [ "$HEALTHY" = "true" ]; then
              echo "Found healthy authelia container on endpoint $id"
              FOUND="true"
              break
            fi
          done

          echo "authelia_healthy=$FOUND" >> $GITHUB_OUTPUT

      # Reads the current settings, changes only AuthenticationMethod/OAuthSettings,
      # and PUTs the whole object back - /api/settings has no partial-update
      # semantics for OAuthSettings (it replaces that struct wholesale), so
      # touching only the fields we care about via jq on the fetched object,
      # rather than constructing a payload from scratch, is what keeps every
      # other setting (LDAP, snapshot interval, DefaultTeamID, etc.) intact.
      - name: Enable OAuth for Portainer via API
        if: ${{ steps.node_config.outputs.compose_filepath == 'portainer/portainer-compose.yml' && steps.check_authelia.outputs.authelia_healthy == 'true' }}
        env:
          PORTAINER_OIDC_CLIENT_SECRET: ${{ secrets.PORTAINER_OIDC_CLIENT_SECRET }}
        run: |
          CURRENT=$(curl -s -X GET "http://${{ vars.RPI4_IP }}:83/api/settings" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")

          BODY=$(echo "$CURRENT" | jq \
            --arg client_secret "$PORTAINER_OIDC_CLIENT_SECRET" \
            --arg auth_uri "https://auth.14monarch.james-fagg.uk/api/oidc/authorization" \
            --arg token_uri "https://auth.14monarch.james-fagg.uk/api/oidc/token" \
            --arg resource_uri "https://auth.14monarch.james-fagg.uk/api/oidc/userinfo" \
            --arg redirect_uri "https://${{ env.domain }}" \
            '.AuthenticationMethod = 3
             | .OAuthSettings.ClientID = "portainer"
             | .OAuthSettings.ClientSecret = $client_secret
             | .OAuthSettings.AuthorizationURI = $auth_uri
             | .OAuthSettings.AccessTokenURI = $token_uri
             | .OAuthSettings.ResourceURI = $resource_uri
             | .OAuthSettings.RedirectURI = $redirect_uri
             | .OAuthSettings.UserIdentifier = "preferred_username"
             | .OAuthSettings.Scopes = "openid profile groups email"
             | .OAuthSettings.OAuthAutoCreateUsers = true
             | .OAuthSettings.SSO = true
             | .OAuthSettings.AuthStyle = 1')

          RESPONSE=$(curl -s -X PUT "http://${{ vars.RPI4_IP }}:83/api/settings" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            -w "\n%{http_code}")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          RESP_BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            echo "OAuth settings updated successfully."
          else
            echo "::error::Failed to update Portainer OAuth settings"
            echo "$RESP_BODY"
            exit 1
          fi

      # NPM (nginx) needs this directory to exist and be writable before it
      # can write portainer/access.log into it - it won't create missing
      # parent dirs itself. Runs on both on-prem NPM instances since
      # keepalived can float which one is actually serving traffic; only
      # ljfcloud-arm's NPM (not covered here) is out of fail2ban's reach
      # entirely, same as every other existing jail.
      - name: Ensure NPM f2b log directory exists
        if: ${{ matrix.host_machine == 'rpi4-server' || matrix.host_machine == 'e7270-server' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.node_config.outputs.ssh_host }}
          username: ${{ steps.node_config.outputs.ssh_user }}
          key: ${{ steps.node_config.outputs.ssh_key }}
          script: |
            sudo mkdir -p /opt/f2b-logs/nginx-proxy-manager/portainer

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show

  proxy_setup_onprem:
    needs: deploy
    uses: ./.github/workflows/proxy_config_onprem.yml
    secrets: inherit
    with:
      domain: ${{ inputs.domain || 'portainer.14monarch.james-fagg.uk' }}
      # The actual Portainer UI this domain points at only ever runs on
      # rpi4-server (e7270/ljfcloud-arm in the deploy matrix are agents).
      app_host_machine: 'rpi4-server'
      forward_port: 83
      # Portainer CE's own logs never carry the client IP (that's Business
      # Edition-only), so this replaces NPM's default per-host access log
      # with one that also captures it, for fail2ban - see
      # portainer/filter.d/portainer.local. NPM's own "View Log" for this
      # host will read empty as a result; fail2ban's copy is the real record
      # now. Mirrors proxy_config_onprem.yml's own Authelia auth_request
      # block for the parts unrelated to logging (WebSocket headers etc.,
      # needed for Portainer's docker exec/attach console).
      advanced_config: |
        location / {
          access_log /data/logs/portainer/access.log f2b_login;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $http_connection;
          proxy_http_version 1.1;
          proxy_pass_request_headers on;
          include conf.d/include/proxy.conf;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
  proxy_setup_oci:
    # This step adds nginx1, nginx2 and nginx.14monarch.james-fagg.uk to the OCI nginx.
    needs: deploy
    uses: ./.github/workflows/proxy_config_oci.yml
    secrets: inherit
    with:
      domain: ${{ inputs.domain || 'portainer.14monarch.james-fagg.uk' }}
      # The actual Portainer UI this domain points at only ever runs on
      # rpi4-server (e7270/ljfcloud-arm in the deploy matrix are agents),
      # regardless of the host_machine input.
      host_machine: 'rpi4-server'
      protect_with_authelia: false
  # Deployed to both on-prem NPM instances, not just rpi4-server (where
  # Portainer's UI itself runs) - keepalived can float which node is
  # actually serving portainer.14monarch.james-fagg.uk at any moment, so a
  # login attempt's access log entry can land on either one. Bans still go
  # through the shared oci-waf blocklist either way, so either instance
  # catching the pattern protects both.
  fail2ban_setup_rpi4:
    needs: [deploy, proxy_setup_onprem]
    uses: ./.github/workflows/fail2ban-jail-deploy.yml
    permissions:
      actions: write
      contents: read
    secrets: inherit
    with:
      host_machine: 'rpi4-server'
      stack_name: 'portainer'
      log_filename: 'access.log'
  fail2ban_setup_e7270:
    needs: [deploy, proxy_setup_onprem]
    uses: ./.github/workflows/fail2ban-jail-deploy.yml
    permissions:
      actions: write
      contents: read
    secrets: inherit
    with:
      host_machine: 'e7270-server'
      stack_name: 'portainer'
      log_filename: 'access.log'

