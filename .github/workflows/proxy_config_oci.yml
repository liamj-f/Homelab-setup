name: Ensure OCI Proxy Host

# Shared by every *-deploy.yml pipeline's OCI leg. Centralises two things
# that used to be duplicated (and drifting) per-pipeline:
#   1. The OCI nginx-proxy-manager (on ljfcloud-arm) gets exactly ONE
#      certificate, covering every SAN oci-cert-updater needs to push into
#      the OCI certificate store. Previously each pipeline resolved/created
#      its own narrow "*.<its own rootdomain>" cert, so the OCI store ended
#      up with whichever narrow cert happened to CN-match - never the
#      multi-SAN cert every OCI-routed service actually needs.
#   2. The proxy-host create/update logic (incl. optional Authelia
#      forward-auth wiring), previously copy-pasted into every workflow.
on:
  workflow_call:
    inputs:
      domain:
        description: 'Primary domain name for this proxy host (e.g. pihole.14monarch.james-fagg.uk)'
        required: true
        type: string
      host_machine:
        description: 'The host_machine the parent pipeline actually deploys this service to (rpi4-server, e7270-server, ljfcloud-arm, ...). Used only to auto-select the forward target when forward_host is not supplied: rpi4-server/e7270-server (on-prem, reached over the rathole tunnel) route via rathole-server:3000 - anything else needs forward_host/forward_port supplied explicitly.'
        required: false
        type: string
        default: ''
      extra_domain_prefixes:
        description: 'Comma-separated, no spaces, list of extra label prefixes on the same rootdomain as `domain` (e.g. "nginx1,nginx2" -> nginx1.<rootdomain>, nginx2.<rootdomain>)'
        required: false
        type: string
        default: ''
      forward_host:
        description: 'Explicit forward host - the container name from that service''s own compose file. Leave empty to auto-select "rathole-server" from `host_machine` instead.'
        required: false
        type: string
        default: ''
      forward_port:
        description: 'Forward port. Leave empty/0 to auto-select 3000 alongside the rathole-server default.'
        required: false
        type: number
        default: 0
      forward_scheme:
        required: false
        type: string
        default: 'http'
      protect_with_authelia:
        description: 'Wire an Authelia forward-auth (auth_request) block into this proxy host. Ignored if `advanced_config` is set.'
        required: false
        type: boolean
        default: false
      advanced_config:
        description: 'Raw NPM "Advanced" nginx config to use verbatim instead of the Authelia auth_request block (e.g. header rewrites a service needs regardless of Authelia).'
        required: false
        type: string
        default: ''

jobs:
  proxy_setup_oci:
    env:
      domain: ${{ inputs.domain }}
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-deployments
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Calculate base domain and forward target
        shell: bash
        run: |
          rootdomain="${domain#*.}"
          echo "rootdomain=$rootdomain" >> "$GITHUB_ENV"

          forward_host="${{ inputs.forward_host }}"
          forward_port="${{ inputs.forward_port }}"
          if [ -z "$forward_host" ]; then
            case "${{ inputs.host_machine }}" in
              rpi4-server|e7270-server)
                forward_host="rathole-server"
                forward_port="3000"
                ;;
              *)
                echo "::error::forward_host (and forward_port) must be supplied explicitly when host_machine is '${{ inputs.host_machine }}' (only rpi4-server/e7270-server auto-route via rathole-server)"
                exit 1
                ;;
            esac
          fi
          echo "forward_host=$forward_host" >> "$GITHUB_ENV"
          echo "forward_port=$forward_port" >> "$GITHUB_ENV"

      - name: Build proxy host domain_names
        id: domains
        shell: bash
        run: |
          domain_names_json=$(jq -nc \
            --arg d "$domain" \
            --arg root "$rootdomain" \
            --arg prefixes "${{ inputs.extra_domain_prefixes }}" \
            '($prefixes | split(",") | map(select(length>0)) | map(. + "." + $root)) as $extras
             | [$d] + $extras')
          echo "domain_names_json=$domain_names_json" >> "$GITHUB_OUTPUT"

      - name: Set node config
        id: node_config
        run: |
          echo "ssh_host=${{ vars.IP_LJFCLOUD_ARM }}" >> $GITHUB_OUTPUT
          echo "ssh_user=${{ vars.LJFCLOUD_USER }}" >> $GITHUB_OUTPUT
          echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
          echo "${{ secrets.SSH_KEY_LJFCLOUD_ARM }}" >> $GITHUB_OUTPUT
          echo "EOF_KEY" >> $GITHUB_OUTPUT

      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 192.168.2.2/30
          DNS = ${{ vars.Keepalived_IP }}
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, ${{ vars.IP_LJFCLOUD_ARM }}/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5: bringing up WireGuard..."
            if sudo wg-quick up ./wg0.conf; then
              echo "WireGuard up successfully"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "WireGuard failed after 5 attempts"
              exit 1
            fi
            echo "Failed, waiting 10s before retry..."
            sudo ip link delete dev wg0 2>/dev/null || true
            sleep 10
          done
          sudo wg show

      # Authelia only ever runs on rpi4-server. If it isn't there and
      # healthy, fall back to plain (unprotected) config instead of wiring
      # in an auth_request that would point at a container that can't
      # actually answer - avoids ever locking a service out over a missing
      # or still-starting Authelia.
      - name: Check Authelia is healthy
        id: check_authelia
        if: ${{ inputs.protect_with_authelia && inputs.advanced_config == '' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.RPI4_IP }}
          username: ${{ vars.RPI4_USER }}
          key: ${{ secrets.SSH_KEY_RPI4 }}
          capture_stdout: true
          script: |
            HEALTH=$(docker inspect --format '{{.State.Health.Status}}' authelia 2>/dev/null || echo "missing")
            if [ "$HEALTH" = "healthy" ]; then
              echo "AUTHELIA_EXISTS=true"
            else
              echo "AUTHELIA_EXISTS=false"
            fi

      # This NPM instance (ljfcloud-arm) has no LAN route to rpi4 - it has to
      # go back through the rathole tunnel to reach Authelia, the same path
      # every other OCI-tunneled service already uses, with the Host header
      # overridden so on-prem NPM's own host-based routing lands on Authelia.
      - name: Build Authelia advanced_config
        id: authelia_config
        if: ${{ inputs.advanced_config == '' }}
        run: |
          ADVANCED_CONFIG=""
          if [ "${{ inputs.protect_with_authelia }}" = "true" ] && echo "${{ steps.check_authelia.outputs.stdout }}" | grep -q "AUTHELIA_EXISTS=true"; then
            ADVANCED_CONFIG=$(cat <<'EOF'
          location /internal/authelia/authz {
            internal;
            proxy_pass http://rathole-server:3000/api/authz/auth-request;
            proxy_set_header Host auth.14monarch.james-fagg.uk;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URL https://$host$request_uri;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";
            proxy_pass_request_body off;
            proxy_http_version 1.1;
          }

          location / {
            auth_request /internal/authelia/authz;
            auth_request_set $user $upstream_http_remote_user;
            auth_request_set $groups $upstream_http_remote_groups;
            proxy_set_header Remote-User $user;
            proxy_set_header Remote-Groups $groups;
            auth_request_set $redirection_url $upstream_http_location;
            error_page 401 =302 $redirection_url;

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            include conf.d/include/proxy.conf;
          }
          EOF
            )
          fi
          echo "config<<ADV_EOF" >> "$GITHUB_OUTPUT"
          echo "$ADVANCED_CONFIG" >> "$GITHUB_OUTPUT"
          echo "ADV_EOF" >> "$GITHUB_OUTPUT"

      - name: Authenticate as nginx user
        id: token
        run: |
          RESPONSE=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s -X POST "http://${{ steps.node_config.outputs.ssh_host }}:81/api/tokens" \
            -H "Content-Type: application/json" \
            -d '{
                 "identity":"${{ vars.NGINX_EMAIL }}",
                 "secret":"${{ secrets.APP_PASSWORD }}"
                 }')

          TOKEN=$(echo "$RESPONSE" | jq -r '.token // empty')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # There is exactly ONE certificate on this NPM instance covering every
      # SAN oci-cert-updater is expected to push into the OCI certificate
      # store. It's identified by the bare "james-fagg.uk" entry (present in
      # every one of these pipelines' calls, regardless of which service's
      # domain triggered the check), not by any one pipeline's own
      # rootdomain - that's what used to cause a fresh narrow cert per
      # pipeline.
      - name: Resolve shared OCI SSL Certificate ID
        id: cert
        run: |
          cert_id=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s \
            -X GET "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/certificates" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" | \
            jq -r '.[] | select(.domain_names[]? == "james-fagg.uk") | .id' | head -n 1)

          if [ -n "$cert_id" ] && [ "$cert_id" != "null" ]; then
            echo "Found existing shared cert: $cert_id"
            echo "cert_id=$cert_id" >> $GITHUB_OUTPUT
          else
            echo "No existing shared cert found."
            echo "cert_id=" >> $GITHUB_OUTPUT
          fi

      - name: Create shared OCI Certificate
        id: create_cert
        if: ${{ steps.cert.outputs.cert_id == '' }}
        continue-on-error: true
        run: |
          PAYLOAD=$(jq -n \
            --arg key "${{ secrets.PORKBUN_API_KEY }}" \
            --arg secret "${{ secrets.PORKBUN_API_SECRET }}" \
            '{
              provider: "letsencrypt",
              domain_names: [
                "*.14monarch.james-fagg.uk",
                "*.hannah.james-fagg.uk",
                "*.james-fagg.uk",
                "*.liam.james-fagg.uk",
                "*.oci.james-fagg.uk",
                "james-fagg.uk"
              ],
              meta: {
                dns_challenge: true,
                dns_provider: "porkbun",
                dns_provider_credentials: ("dns_porkbun_key=" + $key + "\ndns_porkbun_secret=" + $secret),
                propagation_seconds: 120
              }
            }')

          echo "Creating shared OCI certificate."

          RESPONSE=$(curl --retry 3 --retry-delay 5 --retry-all-errors -sS \
            -X POST "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/certificates" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -d "$PAYLOAD" \
            -w "\n%{http_code}" || true)

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_STATUS"
          echo "$BODY" | sed -E 's/(dns_porkbun_key=)[^ "]+/\1*****/g; s/(dns_porkbun_secret=)[^ "]+/\1*****/g'

          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            cert_id=$(echo "$BODY" | jq -r '.id // empty')
            echo "cert_id=$cert_id" >> $GITHUB_OUTPUT
          fi

      - name: Create or update proxy host
        if: ${{ steps.cert.outputs.cert_id != '' || steps.create_cert.outputs.cert_id != '' }}
        run: |
          echo "Using certificate ID: ${{ steps.cert.outputs.cert_id || steps.create_cert.outputs.cert_id }}"

          Proxy_ID=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s -X GET "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" | jq -r --arg d "$domain" '.[]? | select(.domain_names[] == $d) | .id' | head -n 1 )

          BODY=$(jq -n \
              --argjson domain_names '${{ steps.domains.outputs.domain_names_json }}' \
              --arg forward_host "$forward_host" \
              --arg forward_port "$forward_port" \
              --arg forward_scheme "${{ inputs.forward_scheme }}" \
              --arg cert_id "${{ steps.cert.outputs.cert_id || steps.create_cert.outputs.cert_id }}" \
              --arg advanced_config "${{ inputs.advanced_config != '' && inputs.advanced_config || steps.authelia_config.outputs.config }}" \
              '{
                domain_names: $domain_names,
                forward_host: $forward_host,
                forward_port: ($forward_port|tonumber),
                forward_scheme: $forward_scheme,
                certificate_id: ($cert_id|tonumber),
                allow_websocket_upgrade: 1,
                ssl_forced: false,
                enabled: true,
                block_exploits: true,
                advanced_config: $advanced_config,
                meta: { letsencrypt_agree: false, dns_challenge: false }
              }')

            if [ -n "$Proxy_ID" ] && [ "$Proxy_ID" != "null" ]; then
              echo "Updating existing proxy host with ID: $Proxy_ID"
              curl --retry 3 --retry-delay 5 --retry-all-errors -s \
                -X PUT "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts/$Proxy_ID" \
                -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
                -H "Content-Type: application/json" \
                -d "$BODY" | jq -r '.id // "error"'
            else
              echo "Creating new proxy host for domain: $domain"
              curl --retry 3 --retry-delay 5 --retry-all-errors -s \
                -X POST "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts" \
                -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
                -H "Content-Type: application/json" \
                -d "$BODY" | jq -r '.id // "error"'
            fi

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show
