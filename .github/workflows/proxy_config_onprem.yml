name: Ensure On-Prem Proxy Host

# Shared by every *-deploy.yml pipeline's on-prem leg. Runs once per on-prem
# NPM instance (rpi4-server AND e7270-server, matrixed) so both nodes carry
# an identical proxy host for `domain` - necessary because keepalived can
# float the active node at any time, and OCI's rathole tunnel always lands
# on whichever on-prem NPM instance is reachable.
#
# forward_host for that shared proxy host is resolved from `app_host_machine`
# (the node the app itself actually runs on): rpi4-server -> vars.RPI4_IP,
# e7270-server -> vars.E7270_IP. Pass forward_host explicitly instead when the
# target isn't a single on-prem node (e.g. the shared keepalived VIP).
on:
  workflow_call:
    inputs:
      domain:
        description: 'Primary domain name for this proxy host (e.g. pihole.14monarch.james-fagg.uk)'
        required: true
        type: string
      app_host_machine:
        description: 'The host_machine the parent pipeline actually deploys this service to (rpi4-server or e7270-server). Used only to auto-select forward_host when it is not supplied explicitly.'
        required: false
        type: string
        default: ''
      forward_host:
        description: 'Explicit forward host (e.g. vars.KEEPALIVED_IP for a floating-VIP service). Leave empty to auto-select from `app_host_machine` instead.'
        required: false
        type: string
        default: ''
      forward_port:
        required: true
        type: number
      forward_scheme:
        required: false
        type: string
        default: 'http'
      mesh_prefix:
        description: 'If set (e.g. "nginx", "pihole"), also creates <mesh_prefix>1.<rootdomain> -> this pipelines own on-prem node (rpi4) and <mesh_prefix>2.<rootdomain> -> the other one (e7270), each on forward_port - for services (like the on-prem NPM instances themselves) that run on BOTH on-prem nodes and need to be reachable by either directly, not just via the shared domain.'
        required: false
        type: string
        default: ''
      protect_with_authelia:
        description: 'Wire an Authelia forward-auth (auth_request) block into this proxy host (and any mesh_prefix ones). Authelia is reached directly by IP here (no rathole hop needed on-prem). Ignored if `advanced_config` is set.'
        required: false
        type: boolean
        default: false
      advanced_config:
        description: 'Raw NPM "Advanced" nginx config to use verbatim instead of the Authelia auth_request block (e.g. header rewrites a service needs regardless of Authelia).'
        required: false
        type: string
        default: ''

jobs:
  proxy_setup_onprem:
    env:
      domain: ${{ inputs.domain }}
    runs-on: ubuntu-latest
    concurrency:
      group: homelab-deployments
      cancel-in-progress: false
      queue: max
    strategy:
      max-parallel: 1
      matrix:
        host_machine: [rpi4-server, e7270-server]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Calculate base domain and forward target
        shell: bash
        run: |
          rootdomain="${domain#*.}"
          echo "rootdomain=$rootdomain" >> "$GITHUB_ENV"

          forward_host="${{ inputs.forward_host }}"
          if [ -z "$forward_host" ]; then
            case "${{ inputs.app_host_machine }}" in
              rpi4-server)  forward_host="${{ vars.RPI4_IP }}" ;;
              e7270-server) forward_host="${{ vars.E7270_IP }}" ;;
              *)
                echo "::error::forward_host must be supplied explicitly when app_host_machine is '${{ inputs.app_host_machine }}' (only rpi4-server/e7270-server auto-resolve)"
                exit 1
                ;;
            esac
          fi
          echo "forward_host=$forward_host" >> "$GITHUB_ENV"

      - name: Set node config
        id: node_config
        run: |
          if [ "${{ matrix.host_machine }}" = "rpi4-server" ]; then
            echo "ssh_host=${{ vars.RPI4_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.RPI4_USER }}" >> $GITHUB_OUTPUT
            echo "node_number=1" >> $GITHUB_OUTPUT
            echo "other_ssh_host=${{ vars.E7270_IP }}" >> $GITHUB_OUTPUT
            echo "other_node_number=2" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_RPI4 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.host_machine }}" = "e7270-server" ]; then
            echo "ssh_host=${{ vars.E7270_IP }}" >> $GITHUB_OUTPUT
            echo "ssh_user=${{ vars.E7270_USER }}" >> $GITHUB_OUTPUT
            echo "node_number=2" >> $GITHUB_OUTPUT
            echo "other_ssh_host=${{ vars.RPI4_IP }}" >> $GITHUB_OUTPUT
            echo "other_node_number=1" >> $GITHUB_OUTPUT
            echo "ssh_key<<EOF_KEY" >> $GITHUB_OUTPUT
            echo "${{ secrets.SSH_KEY_E7270 }}" >> $GITHUB_OUTPUT
            echo "EOF_KEY" >> $GITHUB_OUTPUT
          fi

      - name: Install WireGuard
        run: |
          sudo apt-get install -y wireguard || (sudo apt-get update && sudo apt-get install -y wireguard)

      - name: Write WireGuard config
        run: |
          cat > wg0.conf << EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 192.168.2.2/30
          DNS = ${{ vars.Keepalived_IP }}
          MTU = 1250

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
          AllowedIPs = 192.168.0.0/24, ${{ vars.IP_LJFCLOUD_ARM }}/32
          Endpoint = ${{ vars.WG_ENDPOINT }}:51820
          PersistentKeepalive = 25
          EOF

      - name: Bring up VPN
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5: bringing up WireGuard..."
            if sudo wg-quick up ./wg0.conf; then
              echo "WireGuard up successfully"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "WireGuard failed after 5 attempts"
              exit 1
            fi
            echo "Failed, waiting 10s before retry..."
            sudo ip link delete dev wg0 2>/dev/null || true
            sleep 10
          done
          sudo wg show

      # Authelia only ever runs on rpi4-server. If it isn't there and
      # healthy, fall back to plain (unprotected) config instead of wiring
      # in an auth_request that would point at a container that can't
      # actually answer - avoids ever locking a service out over a missing
      # or still-starting Authelia.
      - name: Check Authelia is healthy
        id: check_authelia
        if: ${{ inputs.protect_with_authelia && inputs.advanced_config == '' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.RPI4_IP }}
          username: ${{ vars.RPI4_USER }}
          key: ${{ secrets.SSH_KEY_RPI4 }}
          capture_stdout: true
          script: |
            HEALTH=$(docker inspect --format '{{.State.Health.Status}}' authelia 2>/dev/null || echo "missing")
            if [ "$HEALTH" = "healthy" ]; then
              echo "AUTHELIA_EXISTS=true"
            else
              echo "AUTHELIA_EXISTS=false"
            fi

      # Reached directly by IP:port here - unlike the OCI leg, there's no
      # rathole hop needed since this NPM instance is already on-prem, on
      # the same LAN as Authelia.
      - name: Build Authelia advanced_config
        id: authelia_config
        if: ${{ inputs.advanced_config == '' }}
        run: |
          ADVANCED_CONFIG=""
          if [ "${{ inputs.protect_with_authelia }}" = "true" ] && echo "${{ steps.check_authelia.outputs.stdout }}" | grep -q "AUTHELIA_EXISTS=true"; then
            ADVANCED_CONFIG=$(cat <<'EOF'
          location /internal/authelia/authz {
            internal;
            proxy_pass http://${{ vars.RPI4_IP }}:91/api/authz/auth-request;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URL https://$host$request_uri;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";
            proxy_pass_request_body off;
            proxy_http_version 1.1;
          }

          location / {
            auth_request /internal/authelia/authz;
            auth_request_set $user $upstream_http_remote_user;
            auth_request_set $groups $upstream_http_remote_groups;
            proxy_set_header Remote-User $user;
            proxy_set_header Remote-Groups $groups;
            auth_request_set $redirection_url $upstream_http_location;
            error_page 401 =302 $redirection_url;

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            include conf.d/include/proxy.conf;
            # NPM/nginx's default 60s idle timeout drops long-lived
            # connections (e.g. code-server's WebSocket terminal) even
            # while they're still active - stretch it out for every
            # Authelia-protected host rather than just the one that
            # surfaced it.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
          }
          EOF
            )
          fi
          echo "config<<ADV_EOF" >> "$GITHUB_OUTPUT"
          echo "$ADVANCED_CONFIG" >> "$GITHUB_OUTPUT"
          echo "ADV_EOF" >> "$GITHUB_OUTPUT"

      - name: Authenticate as nginx user
        id: token
        run: |
          RESPONSE=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s -X POST "http://${{ steps.node_config.outputs.ssh_host }}:81/api/tokens" \
            -H "Content-Type: application/json" \
            -d '{
                 "identity":"${{ vars.NGINX_EMAIL }}",
                 "secret":"${{ secrets.APP_PASSWORD }}"
                 }')

          TOKEN=$(echo "$RESPONSE" | jq -r '.token // empty')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Resolve SSL Certificate ID
        id: cert
        run: |
          cert_id=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s \
            -X GET "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/certificates" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" | \
            jq -r --arg d "*.$rootdomain" '.[] | select(.domain_names[] == $d) | .id' | head -n 1)

          if [ -n "$cert_id" ] && [ "$cert_id" != "null" ]; then
            echo "Found existing cert: $cert_id"
            echo "cert_id=$cert_id" >> $GITHUB_OUTPUT
          else
            echo "No existing cert found."
            echo "cert_id=" >> $GITHUB_OUTPUT
          fi

      - name: Create Certificate
        id: create_cert
        if: ${{ steps.cert.outputs.cert_id == '' }}
        continue-on-error: true
        run: |
          PAYLOAD=$(jq -n \
            --arg rootdomain "$rootdomain" \
            --arg key "${{ secrets.PORKBUN_API_KEY }}" \
            --arg secret "${{ secrets.PORKBUN_API_SECRET }}" \
            '{
              provider: "letsencrypt",
              domain_names: ["*." + $rootdomain, $rootdomain],
              meta: {
                dns_challenge: true,
                dns_provider: "porkbun",
                dns_provider_credentials: ("dns_porkbun_key=" + $key + "\ndns_porkbun_secret=" + $secret),
                propagation_seconds: 120
              }
            }')

          echo "Creating certificate for domains: *.${rootdomain}, ${rootdomain}"

          RESPONSE=$(curl --retry 3 --retry-delay 5 --retry-all-errors -sS \
            -X POST "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/certificates" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -d "$PAYLOAD" \
            -w "\n%{http_code}" || true)

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_STATUS"
          echo "$BODY" | sed -E 's/(dns_porkbun_key=)[^ "]+/\1*****/g; s/(dns_porkbun_secret=)[^ "]+/\1*****/g'

          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            cert_id=$(echo "$BODY" | jq -r '.id // empty')
            echo "cert_id=$cert_id" >> $GITHUB_OUTPUT
          fi

      - name: Create or update proxy host
        if: ${{ steps.cert.outputs.cert_id != '' || steps.create_cert.outputs.cert_id != '' }}
        env:
          # Piped in via env instead of inlined as "${{ ... }}" below: that
          # text contains literal nginx $variables (e.g. $host,
          # $request_method), and inlining it directly into a double-quoted
          # bash string would make bash re-expand those as (undefined, so
          # blank) shell variables before jq ever saw them. Referencing
          # "$ADVANCED_CONFIG" instead is a single, non-recursive expansion -
          # the $vars inside its value are never re-parsed by bash.
          ADVANCED_CONFIG: ${{ inputs.advanced_config != '' && inputs.advanced_config || steps.authelia_config.outputs.config }}
        run: |
          echo "Using certificate ID: ${{ steps.cert.outputs.cert_id || steps.create_cert.outputs.cert_id }}"

          Proxy_ID=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s -X GET "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" | jq -r --arg d "$domain" '.[]? | select(.domain_names[] == $d) | .id' | head -n 1 )

          BODY=$(jq -n \
              --arg domain "${{ env.domain }}" \
              --arg host_ip "$forward_host" \
              --arg forward_port "${{ inputs.forward_port }}" \
              --arg forward_scheme "${{ inputs.forward_scheme }}" \
              --arg cert_id "${{ steps.cert.outputs.cert_id || steps.create_cert.outputs.cert_id }}" \
              --arg advanced_config "$ADVANCED_CONFIG" \
              '{
                domain_names: [$domain],
                forward_host: $host_ip,
                forward_port: ($forward_port|tonumber),
                forward_scheme: $forward_scheme,
                certificate_id: ($cert_id|tonumber),
                allow_websocket_upgrade: 1,
                ssl_forced: false,
                enabled: true,
                block_exploits: true,
                advanced_config: $advanced_config,
                meta: { letsencrypt_agree: false, dns_challenge: false }
              }')

            if [ -n "$Proxy_ID" ] && [ "$Proxy_ID" != "null" ]; then
              echo "Updating existing proxy host with ID: $Proxy_ID"
              curl --retry 3 --retry-delay 5 --retry-all-errors -s \
                -X PUT "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts/$Proxy_ID" \
                -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
                -H "Content-Type: application/json" \
                -d "$BODY" | jq -r '.id // "error"'
            else
              echo "Creating new proxy host for domain: $domain"
              curl --retry 3 --retry-delay 5 --retry-all-errors -s \
                -X POST "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts" \
                -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
                -H "Content-Type: application/json" \
                -d "$BODY" | jq -r '.id // "error"'
            fi

      - name: Create or update mesh_prefix{node_number}.$rootdomain proxy host
        if: ${{ inputs.mesh_prefix != '' && (steps.cert.outputs.cert_id != '' || steps.create_cert.outputs.cert_id != '') }}
        env:
          # See the "Create or update proxy host" step above for why this is
          # piped in via env rather than inlined as "${{ ... }}" below.
          ADVANCED_CONFIG: ${{ inputs.advanced_config != '' && inputs.advanced_config || steps.authelia_config.outputs.config }}
        run: |
          echo "Using certificate ID: ${{ steps.cert.outputs.cert_id || steps.create_cert.outputs.cert_id }}"
          node_domain="${{ inputs.mesh_prefix }}${{ steps.node_config.outputs.node_number }}.$rootdomain"

          Proxy_ID=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s -X GET "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" | jq -r --arg d "$node_domain" '.[]? | select(.domain_names[] == $d) | .id' | head -n 1 )

          BODY=$(jq -n \
              --arg domain "$node_domain" \
              --arg host_ip "${{ steps.node_config.outputs.ssh_host }}" \
              --arg forward_port "${{ inputs.forward_port }}" \
              --arg forward_scheme "${{ inputs.forward_scheme }}" \
              --arg cert_id "${{ steps.cert.outputs.cert_id || steps.create_cert.outputs.cert_id }}" \
              --arg advanced_config "$ADVANCED_CONFIG" \
              '{
                domain_names: [$domain],
                forward_host: $host_ip,
                forward_port: ($forward_port|tonumber),
                forward_scheme: $forward_scheme,
                certificate_id: ($cert_id|tonumber),
                allow_websocket_upgrade: 1,
                ssl_forced: false,
                enabled: true,
                block_exploits: true,
                advanced_config: $advanced_config,
                meta: { letsencrypt_agree: false, dns_challenge: false }
              }')

            if [ -n "$Proxy_ID" ] && [ "$Proxy_ID" != "null" ]; then
              echo "Updating existing proxy host with ID: $Proxy_ID"
              curl --retry 3 --retry-delay 5 --retry-all-errors -s \
                -X PUT "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts/$Proxy_ID" \
                -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
                -H "Content-Type: application/json" \
                -d "$BODY" | jq -r '.id // "error"'
            else
              echo "Creating new proxy host for domain: $node_domain"
              curl --retry 3 --retry-delay 5 --retry-all-errors -s \
                -X POST "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts" \
                -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
                -H "Content-Type: application/json" \
                -d "$BODY" | jq -r '.id // "error"'
            fi

      - name: Create or update mesh_prefix{other_node_number}.$rootdomain proxy host
        if: ${{ inputs.mesh_prefix != '' && (steps.cert.outputs.cert_id != '' || steps.create_cert.outputs.cert_id != '') }}
        env:
          # See the "Create or update proxy host" step above for why this is
          # piped in via env rather than inlined as "${{ ... }}" below.
          ADVANCED_CONFIG: ${{ inputs.advanced_config != '' && inputs.advanced_config || steps.authelia_config.outputs.config }}
        run: |
          echo "Using certificate ID: ${{ steps.cert.outputs.cert_id || steps.create_cert.outputs.cert_id }}"
          node_domain="${{ inputs.mesh_prefix }}${{ steps.node_config.outputs.other_node_number }}.$rootdomain"

          Proxy_ID=$(curl --retry 3 --retry-delay 5 --retry-all-errors -s -X GET "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" | jq -r --arg d "$node_domain" '.[]? | select(.domain_names[] == $d) | .id' | head -n 1 )

          BODY=$(jq -n \
              --arg domain "$node_domain" \
              --arg host_ip "${{ steps.node_config.outputs.other_ssh_host }}" \
              --arg forward_port "${{ inputs.forward_port }}" \
              --arg forward_scheme "${{ inputs.forward_scheme }}" \
              --arg cert_id "${{ steps.cert.outputs.cert_id || steps.create_cert.outputs.cert_id }}" \
              --arg advanced_config "$ADVANCED_CONFIG" \
              '{
                domain_names: [$domain],
                forward_host: $host_ip,
                forward_port: ($forward_port|tonumber),
                forward_scheme: $forward_scheme,
                certificate_id: ($cert_id|tonumber),
                allow_websocket_upgrade: 1,
                ssl_forced: false,
                enabled: true,
                block_exploits: true,
                advanced_config: $advanced_config,
                meta: { letsencrypt_agree: false, dns_challenge: false }
              }')

            if [ -n "$Proxy_ID" ] && [ "$Proxy_ID" != "null" ]; then
              echo "Updating existing proxy host with ID: $Proxy_ID"
              curl --retry 3 --retry-delay 5 --retry-all-errors -s \
                -X PUT "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts/$Proxy_ID" \
                -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
                -H "Content-Type: application/json" \
                -d "$BODY" | jq -r '.id // "error"'
            else
              echo "Creating new proxy host for domain: $node_domain"
              curl --retry 3 --retry-delay 5 --retry-all-errors -s \
                -X POST "http://${{ steps.node_config.outputs.ssh_host }}:81/api/nginx/proxy-hosts" \
                -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
                -H "Content-Type: application/json" \
                -d "$BODY" | jq -r '.id // "error"'
            fi

      - name: Bring down VPN
        if: always()
        run: |
          sudo wg-quick down ./wg0.conf
          sudo wg show
