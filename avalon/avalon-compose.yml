services:
  avalon-backend:
    container_name: avalon-backend
    image: ghcr.io/liamj-f/avalon-docker/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 4000
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: postgres
      DB_PORT: 5432
      CORS_ORIGIN: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - /opt/f2b-logs/avalon:/app/logs
    networks:
      - db_network
      - avalon_network

    
  avalon-ui:
    container_name: avalon-ui
    image: ghcr.io/liamj-f/avalon-docker/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_HOST: avalon-backend
      BACKEND_PORT: 4000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "92:80"
    depends_on:
      avalon-backend:
        condition: service_healthy
    networks:
      - avalon_network
      
networks:
  db_network: 
    external: true
    name: db_network
  avalon_network:
    name: avalon_network
