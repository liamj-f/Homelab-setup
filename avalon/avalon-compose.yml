services:
  avalon-backend:
    container_name: avalon-backend
    image: ghcr.io/liamj-f/avalon-docker/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 4000
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: postgres
      DB_PORT: 5432
      CORS_ORIGIN: "*"
    networks:
      - db_network
      - avalon_network

    
  avalon-ui:
    container_name: avalon-ui
    image: ghcr.io/liamj-f/avalon-docker/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_HOST: avalon-backend
      BACKEND_PORT: 4000
    ports:
      - "92:80"
    depends_on:
      - avalon-backend
    networks:
      - avalon_network
      
networks:
  db_network: 
    external: true
    name: db_network
  avalon_network:
    name: avalon_network
