services:
  fail2ban:
    image: lscr.io/linuxserver/fail2ban:1.1.0-r2-ls38
    container_name: fail2ban
    restart: unless-stopped
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "fail2ban-client", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - OCID_WAF_BLOCKLIST=${OCID_WAF_BLOCKLIST}
      - OCI_USER=${OCI_USER}
      - OCI_FINGERPRINT=${OCI_FINGERPRINT}
      - OCI_TENANCY=${OCI_TENANCY}
      - OCI_REGION=uk-london-1
      - OCI_KEY_CONTENT_BASE64=${OCI_KEY_CONTENT_BASE64}
    volumes:
      - /opt/stacks/fail2ban/data:/config/fail2ban
      - /opt/stacks/fail2ban/custom-cont-init.d:/custom-cont-init.d:ro
      - /var/log:/var/log:ro
      - /opt/f2b-logs:/remotelogs:ro
      # nextcloud.log lives on the already-mounted /mnt/Nextcloud data drive
      # (nextcloud/nextcloud-compose.yml), not under /opt/f2b-logs like every
      # other service's log - mounted as a single file (not the whole drive)
      # to avoid handing fail2ban the entire user-data tree. This same
      # compose file deploys identically to both rpi4-server and
      # e7270-server (fail2ban-redeploy.yml's matrix), but /mnt/Nextcloud
      # only exists on e7270 (where Nextcloud actually runs) - fail2ban-
      # redeploy.yml sets NEXTCLOUD_LOG_MOUNT to /dev/null on rpi4-server so
      # this resolves to an always-empty, always-valid no-op there instead.
      - ${NEXTCLOUD_LOG_MOUNT:-/dev/null}:/remotelogs/nextcloud/nextcloud.log:ro
    networks:
      - nginx_network

networks:
  nginx_network:
    external: true