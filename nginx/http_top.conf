proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# nginx normalizes $host to lowercase with no port, regardless of what an
# upstream edge (e.g. the OCI Load Balancer/WAF) put in the original Host
# or X-Forwarded-Host header. Without this, a port-suffixed X-Forwarded-Host
# passes straight through every hop and breaks Authelia's exact-match
# against its port-free `session.cookies[].authelia_url` (e.g. "no session
# cookie configuration matches url '...:443'" on /api/user/session/elevation).
proxy_set_header X-Forwarded-Host $host;
proxy_pass_request_headers on;

# Used by hosts that can't log their own login attempts (e.g. Portainer CE,
# whose logs never include the client IP - see portainer/filter.d/portainer.local).
# $proxy_add_x_forwarded_for mirrors what's already forwarded to backends
# above: the real client on the leftmost hop when arriving via the OCI edge,
# or just $remote_addr for a direct/LAN request.
log_format f2b_login '$proxy_add_x_forwarded_for - [$time_local] "$request" $status';
